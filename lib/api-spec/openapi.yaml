openapi: 3.1.0
info:
  # Do not change the title — generated import paths depend on it.
  title: Api
  version: 0.1.0
  description: Axiom-Predict API — backend for the prediction-market trading platform.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health and readiness
  - name: auth
    description: Authenticated-user metadata
  - name: dashboard
    description: Operator dashboard read-models
  - name: models
    description: Trained-model artifact discovery
  - name: swarm
    description: 6-persona LLM swarm + gatekeeper
  - name: orchestrator
    description: Trading cycle scheduler + 12-gate risk pipeline
  - name: admin
    description: Admin console — user role + approval management
  - name: billing
    description: Stripe billing — pricing, subscription, checkout, customer portal
paths:
  /me/access:
    get:
      operationId: getMyAccess
      tags: [auth]
      summary: Whether the signed-in user is approved for the operator console
      responses:
        "200":
          description: Approval status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyAccess" }

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /health:
    get:
      operationId: healthFull
      tags: [health]
      summary: Full readiness check (DB + Storage + secrets present)
      responses:
        "200":
          description: Health snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FullHealth" }

  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Top-level counts and lifetime KPIs from the production database
      parameters:
        - $ref: "#/components/parameters/PlacedByParam"
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardOverview" }

  /dashboard/recent-trades:
    get:
      operationId: getRecentTrades
      tags: [dashboard]
      summary: Most recent trades executed against Kalshi
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
        - $ref: "#/components/parameters/PlacedByParam"
      responses:
        "200":
          description: Recent trades
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeList" }

  /dashboard/swarm-personas:
    get:
      operationId: getSwarmPersonas
      tags: [dashboard]
      summary: Per-analyst Brier / accuracy / calibration metrics
      responses:
        "200":
          description: Swarm metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwarmPersonaList" }

  /dashboard/swarm-personas-today:
    get:
      operationId: getSwarmPersonasToday
      tags: [dashboard]
      summary: Per-persona Brier / accuracy / lean breakdown for a UTC day
      parameters:
        - in: query
          name: date_utc
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
          description: >-
            Optional UTC calendar day (YYYY-MM-DD) to aggregate. Defaults
            to today; bounded to the previous 14 days so operators can
            scrub through recent days inline.
      responses:
        "200":
          description: Per-persona aggregate for the requested UTC day
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwarmPersonaTodayList" }
        "400":
          description: date_utc was malformed or outside the allowed window

  /dashboard/trades/{trade_ref}:
    get:
      operationId: getTradeDetail
      tags: [dashboard]
      summary: Single trade + market-price-vs-model-probability time series
      parameters:
        - in: path
          name: trade_ref
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
          description: Either the integer trades.id or the trade_id UUID
      responses:
        "200":
          description: Trade detail with comparison series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeDetail" }
        "402":
          description: >-
            Free-tier caller has exhausted the daily distinct-market
            quota. Body wraps the upsell payload in FastAPI's standard
            ``detail`` envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradeRequiredError" }
        "404":
          description: No trade matched

  /edge-terminal/input-mode:
    get:
      operationId: getEdgeTerminalInputMode
      tags: [edge-terminal]
      summary: >-
        Return the persisted application input mode (`pipeline` =
        LLM-driven orchestrator; `edge_terminal` = Edge Terminal
        scraper bypass). Default on boot is `edge_terminal`.
      responses:
        "200":
          description: Current input mode + the list of valid modes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeTerminalInputModeResponse" }
    post:
      operationId: setEdgeTerminalInputMode
      tags: [edge-terminal]
      summary: >-
        Flip `app.input_mode`. Elite-tier only (same gate as the live-
        execute toggle, since this controls trade execution source).
        Starts/stops the Edge Terminal poller idempotently.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EdgeTerminalInputModeRequest" }
      responses:
        "200":
          description: Mode persisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeTerminalInputModeSetResponse" }

  /edge-terminal/status:
    get:
      operationId: getEdgeTerminalStatus
      tags: [edge-terminal]
      summary: >-
        Edge Terminal poller status — last_poll_at, last_ok_at, age
        in seconds, stale flag (true when last_ok_at is older than
        120s). Used by the dashboard to grey tiles when the scraper
        is unhealthy.
      responses:
        "200":
          description: Poller status snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeTerminalStatusResponse" }

  /dashboard/edge-terminal-pnl:
    get:
      operationId: getDashboardEdgeTerminalPnl
      tags: [dashboard]
      summary: >-
        Edge Terminal P&L card — cumulative P&L on trades placed by
        the scraper executor since 2026-05-21 (`placed_by =
        'edge_terminal' AND executed_at >= '2026-05-21'`).
      responses:
        "200":
          description: Edge Terminal P&L card payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeTerminalPnlResponse" }

  /dashboard/edge-terminal-signals:
    get:
      operationId: getDashboardEdgeTerminalSignals
      tags: [dashboard]
      summary: >-
        Recent Edge Terminal signals with their executor disposition
        (placed / skipped_unresolved / skipped_gate / errored).
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
      responses:
        "200":
          description: Recent scraped signals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeTerminalSignalsResponse" }

  /dashboard/top-edges:
    get:
      operationId: getDashboardTopEdges
      tags: [dashboard]
      summary: >-
        Pending candidates ranked by EV edge% (cap 25 by default).
        Halted-vertical rows are returned with `vertical_halted=true`
        so the tile can grey them rather than hide them. Snoozed
        candidates (active `prediction_snoozes` row) are excluded.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
      responses:
        "200":
          description: Pending candidates ordered by |edge| descending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopEdgesResponse" }

  /dashboard/bookmaker-metrics:
    get:
      operationId: getDashboardBookmakerMetrics
      tags: [dashboard]
      summary: >-
        Sportsbook-grammar headline numbers (profit factor, equivalent-
        unit P&L, hit rate, today's top confidence/edge, picks-by-
        vertical) over 7d / 30d / YTD windows. Settled trades only for
        PF + unit P&L. "Equivalent units" because live sizing is
        fractional Kelly; 1u = $100 reference stake.
      parameters:
        - in: query
          name: window
          schema:
            type: string
            enum: [7d, 30d, ytd]
            default: 7d
      responses:
        "200":
          description: Bookmaker-grammar metrics for the requested window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookmakerMetricsResponse" }

  /dashboard/live-now:
    get:
      operationId: getDashboardLiveNow
      tags: [dashboard]
      summary: >-
        Per-sport live-games-now tile. Counts of in-progress games and
        is_live predictions, plus the oldest sportradar_live_state feed
        staleness in seconds and the per-sport freshness budget so the
        UI can tint a row yellow/red when the in-game loop falls behind.
      responses:
        "200":
          description: Per-sport live-now snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveNowTileResponse" }

  /dashboard/candidates/{prediction_id}/snooze:
    post:
      operationId: snoozeDashboardCandidate
      tags: [dashboard]
      summary: >-
        Suppress a single pending candidate from the executor + tile
        for `hours` (default 1, cap 30 days).  Latest write wins.
      parameters:
        - in: path
          name: prediction_id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnoozeCandidateRequest" }
      responses:
        "200":
          description: Snooze recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnoozeCandidateResponse" }

  /dashboard/candidates/{prediction_id}/fire:
    post:
      operationId: fireDashboardCandidate
      tags: [dashboard]
      summary: >-
        Clear any active snooze on a candidate so the next executor
        cycle is free to fire it. Not a synchronous execute — the
        orchestrator's per-cycle gates remain the chokepoint.
      parameters:
        - in: path
          name: prediction_id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Snooze cleared (snoozed_until reset to now)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnoozeCandidateResponse" }

  /search:
    get:
      operationId: searchAll
      tags: [dashboard]
      summary: Global search across trades, debates, and cycles
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
          description: Ticker, market id, or ISO date (YYYY-MM-DD)
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Search hits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }

  /dashboard/calibration/ab:
    get:
      operationId: getCalibratorAb
      tags: [dashboard]
      summary: Champion-challenger A/B calibrator history per league
      parameters:
        - in: query
          name: history_limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 5 }
          description: How many recent snapshots (across all roles) to return per league.
      responses:
        "200":
          description: Per-league champion + challenger snapshot history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalibratorAb" }

  /dashboard/v1-backtest-gate:
    get:
      operationId: getV1BacktestGate
      tags: [dashboard]
      summary: Weekly V1 backtest gate (latest run + history)
      description: >-
        Returns the most recent persisted ``v1_backtest_gate_runs`` row
        plus a short history slice so the dashboard tile can render the
        current overall verdict (PASS / FAIL / DEGRADED_…), the
        per-league Brier table, the list of regressed leagues, and a
        sparkline of recent verdicts.  The tile turns red as soon as
        ``regressed_leagues`` is non-empty.
      parameters:
        - in: query
          name: history_limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 8 }
          description: How many recent runs to return in ``history`` (latest first).
      responses:
        "200":
          description: Latest V1 backtest gate run + history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V1BacktestGate" }

  /dashboard/vertical-performance:
    get:
      operationId: getVerticalPerformance
      tags: [dashboard]
      summary: Per-vertical P&L, win rate, Brier, calibration, and PIT histogram
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        - $ref: "#/components/parameters/PlacedByParam"
      responses:
        "200":
          description: Vertical performance bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerticalPerformance" }

  /dashboard/recent-cycles:
    get:
      operationId: getRecentCycles
      tags: [dashboard]
      summary: Most recent trading-loop cycles
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: Recent cycles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradingCycleList" }

  # Public, unauthenticated read-model used by the operator
  # dashboard's tail-risk exposure tile (web + mobile).  Same
  # query-param shape as ``/api/public/equity-curve`` so the tile
  # threads the operator's Manual / System / Both selection
  # (`placed_by`) and the VerticalPicker chip selection (`vertical`
  # CSV) into the read-model in lock-step with every other panel.
  # Kept under tag `dashboard` so the generated client groups it
  # alongside the other dashboard surfaces.
  /public/tail-risk-exposure:
    get:
      operationId: getPublicTailRiskExposure
      tags: [dashboard]
      summary: Bucketed open-exposure + realized-PnL matrix for the tail-risk tile
      description: >-
        Returns a bucket × vertical matrix of open positions and
        realized P&L over the trailing window so the dashboard tile
        can show where today's tail-risk lives without any
        client-side bucketing.  Bucket boundaries and the
        `is_tail` flag are owned by the server.
      parameters:
        - in: query
          name: days
          required: false
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
          description: >-
            Trailing window length in days (clamped to [1, 365]).
            Driven by the dashboard's PeriodStrip selector.
        - $ref: "#/components/parameters/PlacedByParam"
        - in: query
          name: vertical
          required: false
          schema: { type: string }
          description: >-
            Comma-separated list of vertical names (e.g.
            `sports,crypto`).  Unknown names raise HTTP 400 — silently
            returning the unfiltered matrix on a typo would be a
            P&L-display foot-gun on a tile whose entire purpose is to
            highlight risk concentration.
      responses:
        "200":
          description: Bucketed tail-risk exposure payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TailRiskExposure" }
        "400":
          description: vertical contained an unknown name

  /dashboard/over-filled-orders-today:
    get:
      operationId: getOverFilledOrdersToday
      tags: [dashboard]
      summary: GTC orders Kalshi over-filled in the current UTC day
      responses:
        "200":
          description: Today's over-filled GTC orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverFilledOrdersToday" }

  /dashboard/crypto-ohlcv-retention:
    get:
      operationId: getCryptoOhlcvRetentionStatus
      tags: [dashboard]
      summary: Health snapshot of the crypto_ohlcv bar-table retention sweep
      responses:
        "200":
          description: Retention loop state (running/enabled, last tick, errors, deletion counts, retention windows)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CryptoOhlcvRetentionStatus" }

  /dashboard/crypto/backtest-retention:
    get:
      operationId: getCryptoBacktestRetentionStatus
      tags: [dashboard]
      summary: Health snapshot of the crypto_backtest_runs trend-table retention sweep
      responses:
        "200":
          description: Retention loop state (running/enabled, last tick, errors, deletion counts, policy)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CryptoBacktestRetentionStatus" }

  /dashboard/sportradar-leaderboards-retention:
    get:
      operationId: getSportradarLeaderboardsRetentionStatus
      tags: [dashboard]
      summary: Health snapshot of the sportradar_tournament_leaderboards history-table retention sweep
      responses:
        "200":
          description: Retention loop state (running/enabled, last tick, errors, deletion counts, policy)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SportradarLeaderboardsRetentionStatus" }

  /dashboard/supabase-growth-retention:
    get:
      operationId: getSupabaseGrowthRetentionStatus
      tags: [dashboard]
      summary: Health snapshot of every task #757 Supabase-growth retention loop
      responses:
        "200":
          description: Per-loop state for the archive-then-delete and delete-only loops, plus aggregate health counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupabaseGrowthRetentionStatus" }

  /dashboard/slippage-guard-rejects:
    get:
      operationId: getSlippageGuardRejects
      tags: [dashboard]
      summary: Detail rows for trades the pre-submit slippage guard rejected
      parameters:
        - in: query
          name: cycle_id
          schema: { type: integer }
        - in: query
          name: since_hours
          schema: { type: integer, minimum: 1, maximum: 168, default: 24 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Slippage-guard rejection rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlippageGuardRejectList" }

  /dashboard/bankroll/recent:
    get:
      operationId: getRecentBankrollEvents
      tags: [dashboard]
      summary: Recent bankroll_events rows + current live balance + sync freshness
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Bankroll feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankrollRecent" }

  /dashboard/recent-debates:
    get:
      operationId: getRecentDebates
      tags: [dashboard]
      summary: Most recent 6-persona swarm debates
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: Recent debates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwarmDebateList" }

  /dashboard/debates/{debate_id}/entrant-markets:
    get:
      operationId: getDebateEntrantMarkets
      tags: [dashboard]
      summary: >-
        Per-entrant outright Kalshi markets + latest mid price for a
        tournament debate (Pro+).  Backs the analyst tournament view on
        the swarm-debates panel — each row in the per-entrant
        probability table routes to the resolved outright leg's
        public Kalshi page and displays its current mid next to the
        model probability.
      parameters:
        - in: path
          name: debate_id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Resolved per-entrant market map (entries omitted for entrants whose outright leg can't be resolved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DebateEntrantMarkets" }
        "404":
          description: Debate not found

  /market-title/{ticker}:
    get:
      operationId: getMarketTitle
      tags: [dashboard]
      summary: Resolve a Kalshi ticker to a human-readable market title
      parameters:
        - in: path
          name: ticker
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Resolved title (or null if unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketTitle" }

  /swarm/debate:
    post:
      operationId: runSwarmDebate
      tags: [swarm]
      summary: Run a 6-persona swarm debate against a candidate trade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwarmDebateRequest" }
      responses:
        "200":
          description: Debate result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwarmDebateResult" }

  /orchestrator/status:
    get:
      operationId: getOrchestratorStatus
      tags: [orchestrator]
      summary: Cycle scheduler status + last cycle summary per vertical
      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrchestratorStatus" }

  /orchestrator/run-cycle:
    post:
      operationId: runOrchestratorCycle
      tags: [orchestrator]
      summary: Manually fire a single trading cycle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrchestratorRunCycleRequest" }
      responses:
        "200":
          description: Cycle result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrchestratorCycleResult" }

  /settlement/status:
    get:
      operationId: getSettlementStatus
      tags: [settlement]
      summary: Settlement scheduler status + last cycle summary
      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementStatus" }

  /health/model-alerts:
    get:
      operationId: listModelHealthAlerts
      tags: [health]
      summary: Open (or all) model health / drift alerts
      parameters:
        - in: query
          name: ack
          schema: { type: boolean, default: false }
          description: Include acknowledged + snoozed alerts in addition to open ones
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelHealthAlertList" }

  /health/acknowledge-alert:
    post:
      operationId: acknowledgeModelHealthAlert
      tags: [health]
      summary: Acknowledge or snooze a model health alert by id
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcknowledgeAlertRequest" }
      responses:
        "200":
          description: Updated alert state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcknowledgeAlertResult" }

  /settlement/run-cycle:
    post:
      operationId: runSettlementCycle
      tags: [settlement]
      summary: Manually trigger one settlement sweep
      responses:
        "200":
          description: Cycle result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementCycleResult" }

  /settlement/settle-market:
    post:
      operationId: settleMarket
      tags: [settlement]
      summary: Manual / backfill settlement of a single market
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettleMarketRequest" }
      responses:
        "200":
          description: Settlement result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettleMarketResult" }

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List every user the system has seen sign in
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserList" }

  /admin/users/{clerk_user_id}:
    get:
      operationId: adminGetUser
      tags: [admin]
      summary: Detail view for a single user
      parameters:
        - in: path
          name: clerk_user_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }

  /admin/users/{clerk_user_id}/approved:
    post:
      operationId: adminSetUserApproved
      tags: [admin]
      summary: Approve or revoke operator access for a user
      parameters:
        - in: path
          name: clerk_user_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSetApprovedRequest" }
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSetFlagResult" }

  /admin/users/{clerk_user_id}/admin:
    post:
      operationId: adminSetUserAdmin
      tags: [admin]
      summary: Promote or demote a user to admin
      parameters:
        - in: path
          name: clerk_user_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSetAdminRequest" }
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSetFlagResult" }

  /admin/access-requests:
    get:
      operationId: adminListAccessRequests
      tags: [admin]
      summary: Users awaiting operator approval
      responses:
        "200":
          description: Pending access requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccessRequestList" }

  /admin/access-requests/denied:
    get:
      operationId: adminListDeniedAccessRequests
      tags: [admin]
      summary: Users an operator previously denied (most recent first)
      responses:
        "200":
          description: Denied access requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccessRequestList" }

  /admin/access-requests/{clerk_user_id}:
    post:
      operationId: adminDecideAccessRequest
      tags: [admin]
      summary: Approve, deny, or re-invite (undeny) an access request
      parameters:
        - in: path
          name: clerk_user_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAccessRequestDecision" }
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccessRequestResult" }

  /admin/emergency-stop:
    post:
      operationId: adminEmergencyStop
      tags: [admin]
      summary: Cancel every resting Kalshi order and halt trading
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmergencyStopRequest" }
      responses:
        "200":
          description: Stop completed (cancel + halt + audit + alert)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmergencyStopResult" }

  /admin/rearm-trading:
    post:
      operationId: adminRearmTrading
      tags: [admin]
      summary: Clear an emergency-stop halt and reset trading_mode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RearmTradingRequest" }
      responses:
        "200":
          description: Trading re-armed at the requested mode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RearmTradingResult" }

  /admin/audit-log:
    get:
      operationId: adminGetAuditLog
      tags: [admin]
      summary: Recent admin role / approval audit entries
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: target
          schema: { type: string }
          description: Target user id (exact) or email substring (case-insensitive)
        - in: query
          name: actor
          schema: { type: string }
          description: Actor user id (exact) or email substring (case-insensitive)
        - in: query
          name: action
          schema: { type: string }
          description: Exact action name (e.g. set_approved, set_admin)
      responses:
        "200":
          description: Audit log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditLogList" }

  /admin/audit-log/actions:
    get:
      operationId: adminGetAuditLogActions
      tags: [admin]
      summary: Distinct action values present in the audit log (for filter UI)
      responses:
        "200":
          description: Action list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditLogActionList" }

  /admin/autoresearch/features:
    get:
      operationId: adminAutoResearchListFeatures
      tags: [admin]
      summary: List AutoResearch-discovered candidate features (UW signals)
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [shadow, production, rejected] }
        - in: query
          name: vertical
          schema: { type: string }
      responses:
        "200":
          description: Candidate features + scheduler status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoResearchFeatureList" }

  /admin/autoresearch/features/{name}/decision:
    post:
      operationId: adminAutoResearchDecide
      tags: [admin]
      summary: Promote / reject / reset a discovered candidate feature
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoResearchDecisionRequest" }
      responses:
        "200":
          description: Updated candidate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoResearchFeature" }
        "404":
          description: Candidate not found

  /dashboard/verticals:
    get:
      operationId: getVerticalsOverview
      tags: [dashboard]
      summary: Per-vertical overview cards (Task #204)
      parameters:
        - in: query
          name: days
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 365 }
        - $ref: "#/components/parameters/PlacedByParam"
      responses:
        "200":
          description: Vertical overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerticalsOverview" }

  /dashboard/vertical-visibility:
    get:
      operationId: getVerticalVisibility
      tags: [dashboard]
      summary: Operator-set hidden / pinned vertical lists
      responses:
        "200":
          description: Visibility lists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerticalVisibility" }

  /admin/vertical-visibility:
    get:
      operationId: adminGetVerticalVisibility
      tags: [admin]
      summary: Admin view of the per-vertical visibility lists
      responses:
        "200":
          description: Visibility lists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerticalVisibility" }
    post:
      operationId: adminSetVerticalVisibility
      tags: [admin]
      summary: Replace the hidden / pinned vertical lists (admin-only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSetVerticalVisibilityRequest" }
      responses:
        "200":
          description: Updated visibility lists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerticalVisibility" }
        "400":
          description: Unknown vertical name in payload

  /admin/autoresearch/run:
    post:
      operationId: adminAutoResearchRun
      tags: [admin]
      summary: Trigger one AutoResearch mining pass synchronously
      responses:
        "200":
          description: Mining-run summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoResearchRunResult" }

  /orchestrator/live-execute:
    get:
      operationId: getLiveExecuteState
      tags: [orchestrator]
      summary: Effective live-execute state + caller's permission to flip it
      responses:
        "200":
          description: Live-execute state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveExecuteState" }
    post:
      operationId: setLiveExecuteState
      tags: [orchestrator]
      summary: Toggle live-execute on or off (Elite-only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiveExecuteToggleRequest" }
      responses:
        "200":
          description: Updated live-execute state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveExecuteState" }
        "403":
          description: Caller's tier is below Elite

  /me/subscription:
    get:
      operationId: getMySubscription
      tags: [billing]
      summary: The signed-in user's effective subscription / tier
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSubscription" }

  /billing/pricing:
    get:
      operationId: getBillingPricing
      tags: [billing]
      summary: Public pricing catalog with configured Stripe price IDs
      responses:
        "200":
          description: Pricing catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingCatalog" }

  /billing/checkout-session:
    post:
      operationId: createBillingCheckoutSession
      tags: [billing]
      summary: Create a Stripe Checkout session for the requested price
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutSessionRequest" }
      responses:
        "200":
          description: Stripe Checkout session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSessionResult" }

  /billing/portal-session:
    post:
      operationId: createBillingPortalSession
      tags: [billing]
      summary: Create a Stripe Customer Portal session for the signed-in user
      responses:
        "200":
          description: Stripe Customer Portal session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalSessionResult" }

  /models/inventory:
    get:
      operationId: getModelsInventory
      tags: [models]
      summary: Trained-model archive inventory in Supabase Storage
      responses:
        "200":
          description: Storage inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelsInventory" }

components:
  parameters:
    PlacedByParam:
      # Trade-provenance filter (Manual / System / Both) — see
      # migration 0039_trades_placed_by + the
      # ``_placed_by_predicate`` SQL helper in app/dashboard.py.
      # ``manual`` → only operator UI trades (placed_by='manual_ui').
      # ``system`` → only orchestrator/autotrader/swarm trades.
      # ``all``    → unfiltered (default; includes rh_import +
      #              unknown buckets that the toggle deliberately
      #              hides from the manual/system halves).
      in: query
      name: placed_by
      required: false
      schema:
        type: string
        enum: [manual, system, all, edge_terminal, pipeline]
        default: all
      description: >-
        Provenance bucket to scope trade-derived metrics by.  The
        web + mobile UIs surface this as a 3-segment toggle on
        every P&L analytics surface.  ``edge_terminal`` /
        ``pipeline`` are the source-mode buckets driven by the
        input-mode toggle (Edge Terminal scraper vs the legacy ML
        pipeline) — every dashboard tile reuses this parameter to
        filter to the currently active source.

  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    MyAccess:
      type: object
      properties:
        approved: { type: boolean }
        is_admin: { type: boolean }
        email: { type: string, nullable: true }
        user_id: { type: string }
      required: [approved, is_admin, user_id]

    SecretsPresent:
      type: object
      properties:
        openai: { type: boolean }
        anthropic: { type: boolean }
        kalshi: { type: boolean }
      required: [openai, anthropic, kalshi]

    PostgresHealth:
      type: object
      properties:
        ok: { type: boolean }
        version: { type: string, nullable: true }
        public_tables: { type: integer, nullable: true }
        error: { type: string, nullable: true }
      required: [ok]

    StorageSampleEntry:
      type: object
      properties:
        name: { type: string }
        folder: { type: boolean }
      required: [name, folder]

    StorageHealth:
      type: object
      properties:
        ok: { type: boolean }
        bucket: { type: string, nullable: true }
        sample:
          type: array
          items: { $ref: "#/components/schemas/StorageSampleEntry" }
        error: { type: string, nullable: true }
      required: [ok]

    KalshiWsHealth:
      type: object
      description: Live state of the Kalshi WebSocket subscriber, including which
        cluster (demo vs prod) the upgrade is pointed at.
      properties:
        connected: { type: boolean }
        last_error: { type: string, nullable: true }
        subscribers: { type: integer }
        env:
          type: string
          enum: [demo, prod]
          description: Kalshi cluster the WS is connected to ("demo" or "prod").
        url:
          type: string
          description: Full WebSocket URL used for the upgrade. Lets operators
            spot wrong-cluster mistakes at a glance.
      required: [connected, env, url]

    FullHealth:
      type: object
      properties:
        status: { type: string }
        supabase_project: { type: string }
        paper_mode: { type: boolean }
        kalshi_env: { type: string }
        secrets_present: { $ref: "#/components/schemas/SecretsPresent" }
        postgres: { $ref: "#/components/schemas/PostgresHealth" }
        storage: { $ref: "#/components/schemas/StorageHealth" }
        kalshi_ws: { $ref: "#/components/schemas/KalshiWsHealth" }
        active_predictor:
          oneOf:
            - { $ref: "#/components/schemas/ActivePredictor" }
            - { type: "null" }
      required: [status, supabase_project, paper_mode, kalshi_env, secrets_present]

    ActivePredictor:
      type: object
      description: Currently-bound canonical predictor surfaced on the operator console.
      properties:
        name: { type: string }
        version: { type: string, description: "Short version tag (first 12 hex of sha256)." }
        sha256: { type: string, nullable: true, description: "Full sha256 of the predictor file." }
        type: { type: string }
        module: { type: string }
        n_features_in: { type: integer, nullable: true }
        bound: { type: boolean, description: "True once predict() has bound the predictor; false during lazy peek." }
        loaded_at: { type: number, nullable: true, description: "Unix timestamp (seconds) when the predictor was bound." }
      required: [name, version, type, module, bound]

    DashboardCounts:
      type: object
      properties:
        trading_cycles: { type: integer, nullable: true }
        trades: { type: integer, nullable: true }
        swarm_debates: { type: integer, nullable: true }
        ml_training_logs: { type: integer, nullable: true }
        predictions: { type: integer, nullable: true }
        positions: { type: integer, nullable: true }

    DashboardOverview:
      type: object
      properties:
        counts: { $ref: "#/components/schemas/DashboardCounts" }
        latest_cycle_at: { type: string, nullable: true }
        latest_trade_at: { type: string, nullable: true }
        realized_pnl: { type: number, nullable: true }
        win_rate: { type: number, nullable: true }
        open_positions: { type: integer, nullable: true }
        placed_by:
          type: string
          enum: [manual, system, all, edge_terminal, pipeline]
          description: >-
            Echo of the active provenance filter so the UI can
            reconstruct the toggle state without re-parsing the URL.
      required: [counts]

    TopEdgeItem:
      type: object
      description: One pending candidate row in the Top-Edges-Today tile.
      properties:
        prediction_id: { type: integer }
        matchup: { type: string, description: "Human-readable label (matchup, title, or fallback to market id)." }
        league: { type: string, nullable: true }
        vertical:
          type: string
          description: Coarse vertical bucket (sports/crypto/elections/tech_ai).
        vertical_halted:
          type: boolean
          description: True when the operator has halted this vertical; the row is still listed (greyed) per the architectural constraint.
        model_prob: { type: number, nullable: true, description: "Calibrated model_yes_prob (falls back to home_win_prob)." }
        market_price: { type: number, nullable: true, description: "Kalshi yes-price snapshot used to compute edge." }
        edge_pct: { type: number, nullable: true, description: "EV edge expressed as a percentage (edge * 100)." }
        confidence: { type: number, nullable: true }
        planned_stake: { type: number, nullable: true, description: "Indicative planned stake in USD; quarter-Kelly fraction of latest bankroll based on edge and market price. Null when bankroll is unknown or price is degenerate." }
        kalshi_market_id: { type: string, nullable: true }
      required: [prediction_id, matchup, vertical, vertical_halted]

    TopEdgesResponse:
      type: object
      properties:
        limit: { type: integer }
        generated_at: { type: string, description: "ISO-8601 UTC timestamp when the tile was computed." }
        items:
          type: array
          items: { $ref: "#/components/schemas/TopEdgeItem" }
        halted_verticals:
          type: array
          items: { type: string }
          description: Sorted list of currently-halted verticals at compute time.
        error: { type: string, nullable: true, description: "Best-effort error string when the underlying read failed." }
      required: [limit, generated_at, items, halted_verticals]

    BookmakerPicksToday:
      type: object
      properties:
        total: { type: integer }
        by_vertical:
          type: array
          items:
            type: object
            properties:
              vertical: { type: string }
              n: { type: integer }
            required: [vertical, n]
      required: [total, by_vertical]

    BookmakerMetricsResponse:
      type: object
      properties:
        window:
          type: string
          enum: [7d, 30d, ytd]
        generated_at: { type: string }
        profit_factor:
          type: number
          nullable: true
          description: gross_wins / gross_losses on settled trades; null when there are no losses to divide by.
        equivalent_unit_pnl:
          type: number
          nullable: true
          description: >-
            sum(pnl) / `unit_dollars`.  Labelled "equivalent" because
            live sizing is fractional Kelly — this normalises P&L to a
            flat 1u = $unit_dollars reference stake for industry
            comparability.
        unit_dollars:
          type: number
          description: Reference stake denominator used to compute equivalent_unit_pnl.
        win_rate: { type: number, nullable: true, description: "Settled-pick hit rate (0..1)." }
        n_settled: { type: integer, description: "Number of settled trades in the window." }
        top_confidence_today: { type: number, nullable: true }
        highest_edge_today: { type: number, nullable: true, description: "Max |edge| today, expressed as percent." }
        picks_today: { $ref: "#/components/schemas/BookmakerPicksToday" }
        error: { type: string, nullable: true }
      required: [window, generated_at, unit_dollars, n_settled, picks_today]

    LiveNowSportEntry:
      type: object
      properties:
        live_games: { type: integer, description: "In-progress games for this sport." }
        is_live_predictions: { type: integer, description: "Open predictions tagged is_live=true." }
        latest_fetched_at: { type: string, nullable: true }
        oldest_staleness_seconds: { type: number, nullable: true, description: "Age (seconds) of the oldest sportradar_live_state row for this sport." }
        staleness_budget_seconds: { type: number, description: "Per-sport freshness budget (minimum across leagues) the in-game gate uses." }
        error: { type: string, nullable: true }
      required: [live_games, is_live_predictions]

    LiveNowTotals:
      type: object
      properties:
        live_games: { type: integer }
        is_live_predictions: { type: integer }
      required: [live_games, is_live_predictions]

    LiveNowTileResponse:
      type: object
      properties:
        fetched_at: { type: string }
        totals: { $ref: "#/components/schemas/LiveNowTotals" }
        per_sport:
          type: object
          additionalProperties: { $ref: "#/components/schemas/LiveNowSportEntry" }
      required: [fetched_at, totals, per_sport]

    EdgeTerminalInputModeResponse:
      type: object
      properties:
        mode: { type: string, enum: [pipeline, edge_terminal] }
        valid_modes:
          type: array
          items: { type: string }
      required: [mode, valid_modes]

    EdgeTerminalInputModeRequest:
      type: object
      properties:
        mode: { type: string, enum: [pipeline, edge_terminal] }
      required: [mode]

    EdgeTerminalInputModeSetResponse:
      type: object
      properties:
        mode: { type: string, enum: [pipeline, edge_terminal] }
      required: [mode]

    EdgeTerminalStatusResponse:
      type: object
      properties:
        last_poll_at: { type: string, nullable: true }
        last_ok_at: { type: string, nullable: true }
        last_error: { type: string, nullable: true }
        age_seconds: { type: number, nullable: true, description: "Seconds since last_ok_at; null when never succeeded." }
        stale: { type: boolean, description: "True when age_seconds > 120 (or no successful poll yet)." }
        running: { type: boolean }
      required: [stale, running]

    EdgeTerminalPnlResponse:
      type: object
      properties:
        generated_at: { type: string }
        since_date: { type: string, description: "ISO date floor (2026-05-21)." }
        n_trades: { type: integer }
        n_settled: { type: integer }
        cumulative_pnl: { type: number, nullable: true }
        win_rate: { type: number, nullable: true }
        equivalent_units:
          type: number
          nullable: true
          description: >-
            Cumulative realised P&L expressed in 1u = $100
            equivalent units (matches the bookmaker-grammar tile
            convention so the two surfaces stay comparable).
        by_vertical:
          type: array
          description: Per-vertical breakdown of Edge Terminal trades since the floor date.
          items:
            type: object
            properties:
              vertical: { type: string, nullable: true }
              n: { type: integer }
              n_settled: { type: integer }
              pnl: { type: number }
              equivalent_units: { type: number, description: "pnl / 100." }
            required: [n, pnl]
        error: { type: string, nullable: true }
      required: [generated_at, since_date, n_trades, n_settled]

    EdgeTerminalSignalItem:
      type: object
      properties:
        id: { type: integer }
        signal_date: { type: string }
        vertical: { type: string, nullable: true }
        matchup: { type: string, nullable: true }
        selection: { type: string, nullable: true }
        ticker: { type: string, nullable: true }
        disposition: { type: string, nullable: true, description: "placed | skipped_unresolved | skipped_gate | errored | pending" }
        scraped_at: { type: string, nullable: true }
        pick_type: { type: string, nullable: true, description: "Operator-visible category: moneyline | spread | total | player_prop | …" }
        avg_odds: { type: number, nullable: true, description: "Consensus odds the source quoted (American format)." }
        ev_pct: { type: number, nullable: true, description: "Source's own expected-value % for sanity checking our derived edge." }
        source_screenshot_url: { type: string, nullable: true, description: "Optional link to the original Edge Terminal tile screenshot." }
        kalshi_market_id: { type: string, nullable: true, description: "Kalshi market UUID when the source tile already mapped the pick." }
      required: [id, signal_date]

    EdgeTerminalSignalsResponse:
      type: object
      properties:
        limit: { type: integer }
        generated_at: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/EdgeTerminalSignalItem" }
        error: { type: string, nullable: true }
      required: [limit, generated_at, items]

    SnoozeCandidateRequest:
      type: object
      properties:
        hours: { type: number, default: 1.0, minimum: 0, maximum: 720, description: "Snooze duration in hours (cap 30 days)." }
        reason: { type: string, nullable: true }

    SnoozeCandidateResponse:
      type: object
      properties:
        prediction_id: { type: integer }
        snoozed_until: { type: string, nullable: true, description: "ISO-8601 cutoff; null when the write failed (`error` populated)." }
        hours: { type: number }
        error: { type: string, nullable: true }
      required: [prediction_id, hours]

    Trade:
      type: object
      properties:
        id: { type: integer }
        trade_id: { type: string, nullable: true }
        market_id: { type: string, nullable: true }
        vertical: { type: string, nullable: true }
        league: { type: string, nullable: true }
        side: { type: string, nullable: true }
        action: { type: string, nullable: true }
        quantity: { type: number, nullable: true }
        price: { type: number, nullable: true }
        fees: { type: number, nullable: true }
        pnl: { type: number, nullable: true }
        trading_mode: { type: string, nullable: true }
        exchange: { type: string, nullable: true }
        executed_at: { type: string, nullable: true }
        market_title: { type: string, nullable: true }
        placed_by:
          type: string
          nullable: true
          description: >-
            Trade-provenance bucket from migration 0039
            (one of manual_ui / orchestrator / autotrader / swarm /
            operator_recovery / rh_import / unknown).  Per-row tag
            so the UI can show the source even on the unfiltered
            view.
      required: [id]

    MarketTitle:
      type: object
      properties:
        ticker: { type: string }
        title: { type: string, nullable: true }
      required: [ticker]

    TradeList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Trade" }
        tier:
          type: string
          nullable: true
          description: Caller's effective subscription tier (free, pro, elite, founder).
        delayed:
          type: boolean
          description: >-
            True when the response was filtered through the free-tier
            15-minute signal delay; rows newer than `delay_minutes` ago
            were dropped. Always false for Pro+/founder callers.
        delay_minutes:
          type: integer
          description: >-
            Delay window applied when `delayed` is true. 0 when the
            response is undelayed.
        placed_by:
          type: string
