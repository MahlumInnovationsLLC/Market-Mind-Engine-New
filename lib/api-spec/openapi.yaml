    SupabaseGrowthRetentionLoop:
      type: object
      description: |
        One row per task #757 retention loop, mirroring the loop's
        internal `state()` plus the same derived `health` /
        `seconds_since_last_tick` fields the per-loop endpoints expose.
        All fields except `name` and `health` are optional because
        loops that fail to report `state()` are surfaced as a stub row
        with just `{name, health: "error", last_error}`.
      properties:
        name: { type: string, description: "Stable display name for the loop." }
        flavor:
          type: string
          enum: [archive, delete-only, base]
          description: "`archive` = archive-then-delete (ML / training tables). `delete-only` = pure DELETE past horizon."
        table: { type: string, description: "Underlying Postgres table being pruned." }
        ts_column: { type: string, description: "Timestamp column the cutoff is applied against." }
        running: { type: boolean, description: "Whether the asyncio task is currently alive." }
        enabled: { type: boolean, description: "Whether the loop is allowed to run per AXIOM_<PREFIX>_RETENTION_ENABLED." }
        started_at: { type: number, nullable: true, description: "Unix seconds the loop was started." }
        last_tick_at: { type: number, nullable: true, description: "Unix seconds of the most recent sweep." }
        last_error: { type: string, nullable: true, description: "Most recent sweep error, or null." }
        last_deleted: { type: integer, description: "Rows deleted on the most recent sweep." }
        total_deleted: { type: integer, description: "Lifetime rows deleted since the loop started." }
        retention_days: { type: integer, description: "Resolved retention horizon in days." }
        interval_seconds: { type: number, description: "Sweep cadence in seconds." }
        seconds_since_last_tick:
          type: number
          nullable: true
          description: Wall-clock seconds since `last_tick_at`, or null if the loop has never ticked.
        last_archived_rows: { type: integer, description: "(archive flavor) Rows uploaded to Supabase Storage on the most recent sweep." }
        total_archived_rows: { type: integer, description: "(archive flavor) Lifetime rows uploaded." }
        last_bytes_compressed: { type: integer, description: "(archive flavor) Compressed bytes uploaded on the most recent sweep." }
        total_bytes_compressed: { type: integer, description: "(archive flavor) Lifetime compressed bytes uploaded." }
        last_object_key: { type: string, nullable: true, description: "(archive flavor) Storage key of the most recent uploaded chunk." }
        last_object_url: { type: string, nullable: true, description: "(archive flavor) Fully-qualified Supabase Storage URL for `last_object_key`, or null if the loop has never uploaded a chunk." }
        chunk_size: { type: integer, description: "(archive flavor) Rows per upload chunk." }
        max_rows_per_run: { type: integer, nullable: true, description: "(archive flavor) Per-sweep cap on rows processed." }
        pk_columns:
          type: array
          items: { type: string }
          description: "(archive flavor) Primary-key columns used to identify archived rows."
        health:
          type: string
          enum: [ok, stale, error, disabled]
          description: |
            Rolled-up verdict for the row pill:
            `ok` — running and ticked within `2 * interval_seconds`.
            `stale` — meant to be running but hasn't ticked in time.
            `error` — most recent sweep raised; the loop will retry next tick.
            `disabled` — turned off by AXIOM_<PREFIX>_RETENTION_ENABLED=0 (the default).
      required:
        - name
        - health

