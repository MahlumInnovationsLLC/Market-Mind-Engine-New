      type: object
      description: Aggregate count of loops in each health bucket, used by the panel header badge.
      properties:
        ok: { type: integer }
        stale: { type: integer }
        error: { type: integer }
        disabled: { type: integer }
      required: [ok, stale, error, disabled]

    SupabaseGrowthRetentionStatus:
      type: object
      description: |
        Operator-facing snapshot of every task #757 retention loop —
        archive-then-delete loops streamed to Supabase Storage and the
        delete-only loops that prune operational tables in place. Loops
        default DISABLED so a fresh deploy doesn't auto-trigger a
        destructive sweep before the operator has reviewed the dry-run.
      properties:
        archive:
          type: array
          items: { $ref: "#/components/schemas/SupabaseGrowthRetentionLoop" }
          description: Archive-then-delete loops (ML / training tables).
        delete_only:
          type: array
          items: { $ref: "#/components/schemas/SupabaseGrowthRetentionLoop" }
          description: Delete-only loops (operational / audit logs).
        counts: { $ref: "#/components/schemas/SupabaseGrowthRetentionCounts" }
        total: { type: integer, description: "Total number of loops registered (archive + delete_only)." }
      required:
        - archive
        - delete_only
        - counts
        - total

    SlippageGuardReject:
      type: object
      properties:
        id: { type: integer }
        market_ticker: { type: string, nullable: true }
        side: { type: string, nullable: true }
        vertical: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        requested_count: { type: integer, nullable: true }
        filled_available: { type: integer, nullable: true }
        worst_fill_price_cents: { type: integer, nullable: true }
        limit_price_cents: { type: integer, nullable: true }
        slippage_cents: { type: integer, nullable: true }
        model_edge_cents: { type: number, nullable: true }
        edge_erased_pct: { type: number, nullable: true }
        threshold_pct: { type: number, nullable: true }
        cycle_id: { type: integer, nullable: true }
      required: [id]

    SlippageGuardRejectList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SlippageGuardReject" }
        cycle_id: { type: integer, nullable: true }
      required: [items]

    BankrollEvent:
      type: object
      properties:
        id: { type: integer }
        occurred_at: { type: string, nullable: true }
        exchange: { type: string }
        reason:
          type: string
          description: "Stable token: exchange_sync, fill, deposit, withdrawal, manual_adjustment."
        delta_cents: { type: integer }
        balance_cents: { type: integer }
      required: [id, exchange, reason, delta_cents, balance_cents]

    BankrollSyncState:
      type: object
      properties:
        running: { type: boolean }
        started_at: { type: number, nullable: true, description: "Unix timestamp (seconds)." }
        last_tick_at: { type: number, nullable: true, description: "Unix timestamp (seconds)." }
        last_error: { type: string, nullable: true }
        last_balance_cents: { type: integer, nullable: true }
        interval_seconds: { type: number }
      required: [running, interval_seconds]

    BankrollRecent:
      type: object
      properties:
        exchange: { type: string }
        current_balance_cents:
          type: integer
          nullable: true
          description: Cash on hand from the most recent bankroll_events row.
        open_position_value_cents:
          type: integer
          nullable: true
          description: |
            Marked-to-market value of currently open contracts —
            sum(quantity * current_price) over positions where status='open',
            in cents. Null if the per-position computation failed.
        total_equity_cents:
          type: integer
          nullable: true
          description: |
            current_balance_cents + open_position_value_cents — the live
            "what would I have if I closed everything right now" figure.
            Null whenever the cash leg is unknown.
        last_event_at: { type: string, nullable: true }
        items:
          type: array
          description: Chronological — oldest first — so callers can sparkline directly.
          items: { $ref: "#/components/schemas/BankrollEvent" }
        sync: { $ref: "#/components/schemas/BankrollSyncState" }
      required: [exchange, items, sync]

    SwarmDebate:
      type: object
      properties:
        id: { type: integer }
        league: { type: string, nullable: true }
        matchup: { type: string, nullable: true }
        market_type: { type: string, nullable: true }
        consensus_probability: { type: number, nullable: true }
        confidence_band_low: { type: number, nullable: true }
        confidence_band_high: { type: number, nullable: true }
        agreement_rate: { type: number, nullable: true }
        approved: { type: boolean, nullable: true }
        recommended_action: { type: string, nullable: true }
        outcome: { type: string, nullable: true }
        cost_estimate: { type: number, nullable: true }
        latency_ms: { type: number, nullable: true }
        created_at: { type: string, nullable: true }
        # Per-persona reasoning + moderator narrative.  Only populated
        # for Pro+ callers; sub-Pro callers get null + redacted=true.
        analyst_verdicts:
          nullable: true
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
        moderator_synthesis:
          nullable: true
          type: object
          additionalProperties: true
        # Persisted per-debate context (kalshi market id, line, n-way
        # field, etc.).  For tournament-market debates the orchestrator
        # also merges in `plackett_luce_sketch` here so analysts can
        # audit the per-entrant rating + win probability for the field
        # the traded leg was being priced against.  Sub-Pro callers see
        # this stripped (along with the rest of the transcript blob).
        game_context:
          nullable: true
          type: object
          additionalProperties: true
        redacted: { type: boolean, nullable: true }
      required: [id]

    EntrantOutrightMarket:
      type: object
      description: >-
        Resolved outright Kalshi leg for one entrant in a tournament's
        Plackett-Luce field.
      properties:
        kalshi_market_id:
          type: string
          description: Kalshi market ticker for the entrant's YES outright leg.
        mid_cents:
          type: integer
          nullable: true
          description: >-
            Latest cached mid price in cents (mean of the most recent
            tick bucket; falls back to the bucket close).  Null when no
            tick has been recorded for the resolved ticker.
        kalshi_url:
          type: string
          nullable: true
          description: >-
            Public Kalshi market URL the row should route to on click.
            Null when the ticker is malformed.
      required: [kalshi_market_id]

    DebateEntrantMarkets:
      type: object
      properties:
        debate_id: { type: integer }
        traded_market_id:
          type: string
          nullable: true
          description: kalshi_market_id of the leg the swarm actually traded.
        traded_entrant:
          type: string
          nullable: true
          description: >-
            Name of the entrant whose YES outright leg was traded;
            present only when the Plackett-Luce sketch recorded it.
        entrants:
          type: object
          description: >-
            ``{entrant_name: EntrantOutrightMarket}`` map.  Entrants
            whose outright leg can't be resolved (e.g. title cache
            miss) are omitted, so the frontend can render those rows
            non-clickable with no price.
          additionalProperties: { $ref: "#/components/schemas/EntrantOutrightMarket" }
      required: [debate_id, entrants]

    SwarmDebateList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SwarmDebate" }
        tier: { type: string, nullable: true }
        delayed:
          type: boolean
          description: >-
            True when the response was filtered through the free-tier
            15-minute signal delay; rows newer than `delay_minutes` ago
            were dropped. Always false for Pro+/founder callers.
        delay_minutes:
          type: integer
          description: >-
            Delay window applied when `delayed` is true. 0 when the
            response is undelayed.
      required: [items]

    LiveExecuteState:
      type: object
      properties:
        enabled: { type: boolean }
        effective_mode: { type: string }
        env_mode: { type: string }
        db_mode: { type: string, nullable: true }
        source: { type: string }
        caller_tier: { type: string }
        can_toggle: { type: boolean }
      required: [enabled, effective_mode, env_mode, source, caller_tier, can_toggle]

    LiveExecuteToggleRequest:
      type: object
      properties:
        enabled: { type: boolean }
      required: [enabled]

    EmergencyStopRequest:
      type: object
      properties:
        reason: { type: string, nullable: true }

    EmergencyStopResult:
      type: object
      properties:
        ok: { type: boolean }
        canceled_orders: { type: integer }
        trading_mode: { type: string }
        reason: { type: string, nullable: true }
        kill_switch:
          type: object
          additionalProperties: true
      required: [ok, canceled_orders, trading_mode]

    RearmTradingRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [paper, live]
          description: Mode to set risk.trading_mode to after clearing the halt
      required: [mode]

    RearmTradingResult:
      type: object
      properties:
        ok: { type: boolean }
        trading_mode: { type: string }
        previous_mode: { type: string, nullable: true }
        kill_switch:
          type: object
          additionalProperties: true
      required: [ok, trading_mode]

    TradeDetailPoint:
      type: object
      description: One sample of (market price, model probability) at time t
      properties:
        t: { type: string, nullable: true }
        market_price: { type: number, nullable: true }
        model_prob: { type: number, nullable: true }

    TradeDetailRow:
      type: object
      description: Trade row enriched with model snapshot taken at execution
      properties:
        id: { type: integer }
        trade_id: { type: string, nullable: true }
        market_id: { type: string, nullable: true }
        market_title: { type: string, nullable: true }
        vertical: { type: string, nullable: true }
        league: { type: string, nullable: true }
        side: { type: string, nullable: true }
        action: { type: string, nullable: true }
        quantity: { type: number, nullable: true }
        price: { type: number, nullable: true }
        fees: { type: number, nullable: true }
        pnl: { type: number, nullable: true }
        model_prob: { type: number, nullable: true }
        model_edge: { type: number, nullable: true }
        kelly_fraction: { type: number, nullable: true }
        trading_mode: { type: string, nullable: true }
        exchange: { type: string, nullable: true }
        executed_at: { type: string, nullable: true }
      required: [id]

    TradeDetail:
      type: object
      properties:
        trade: { $ref: "#/components/schemas/TradeDetailRow" }
        series:
          type: array
          items: { $ref: "#/components/schemas/TradeDetailPoint" }
        delayed:
          type: boolean
          description: >-
            True when the trade + series were filtered through the
            free-tier 15-minute signal delay. Always false / absent for
            Pro+/founder callers.
        delay_minutes:
          type: integer
          description: >-
            Delay window applied when `delayed` is true. Absent for
            undelayed responses.
        quota:
          allOf:
            - $ref: "#/components/schemas/TradeDetailQuota"
          nullable: true
          description: >-
            Free-tier daily distinct-market quota snapshot taken after
            recording this view. Present only for free callers.
        soccer_match:
          allOf:
            - $ref: "#/components/schemas/SoccerMatchSummary"
          nullable: true
          description: >-
            For soccer (3-way h/d/a) trades whose Sportradar match has
            finalised: home/away team names plus the final scoreline
            and resolved `home`/`draw`/`away` result. Absent (or null)
            for non-soccer markets and for soccer markets whose match
            has not yet finalised.
      required: [trade, series]

    SoccerMatchSummary:
      type: object
      description: >-
        Final scoreline + h/d/a result for a soccer trade, joined from
        `swarm_debates.game_id` into `sportradar_live_state` and the
        `sportradar_schedules` cache.
      properties:
        result:
          type: string
          enum: [home, draw, away]
          description: Resolved 3-way match result.
        home_team:
          type: string
          nullable: true
          description: Home team display name (may be null when the schedule cache hasn't been populated yet).
        away_team:
          type: string
          nullable: true
          description: Away team display name.
        home_score:
          type: integer
          nullable: true
        away_score:
          type: integer
          nullable: true
        status:
          type: string
          nullable: true
          description: Sportradar live-state status (e.g. `closed`, `ended`).
      required: [result]

    TradeDetailQuota:
      type: object
      description: >-
        Per-request snapshot of the free-tier distinct-market quota
        attached to a successful trade-detail response. Mirrors the
        backend's `enforce_market_view_quota` accounting.
      properties:
        tier:
          type: string
          description: Caller's effective subscription tier at time of read.
        viewed_today:
          type: integer
          description: Distinct markets the caller has opened today (UTC).
        limit:
          type: integer
          description: Daily distinct-market limit for the free tier.
      required: [tier, viewed_today, limit]

    UpgradeRequiredPayload:
      type: object
      description: >-
        Structured 402 body returned when a free-tier caller exhausts
        the daily distinct-market quota. See `app.free_tier`.
      properties:
        error:
          type: string
          enum: [upgrade_required]
        reason:
          type: string
          description: Machine-readable reason code (e.g. `free_tier_daily_market_limit`).
        limit:
          type: integer
          description: Daily distinct-market limit the caller hit.
        viewed_today:
          type: integer
          description: Distinct markets the caller has already opened today (UTC).
        market_id:
          type: string
          nullable: true
          description: Market the caller tried to open when the quota refused.
        resets_at:
          type: string
          description: When the quota resets, e.g. `00:00 UTC`.
      required: [error, reason, limit, viewed_today, resets_at]

    UpgradeRequiredError:
      type: object
      description: >-
        FastAPI envelope for the 402 upgrade-required response. The
        meaningful payload lives under `detail`.
      properties:
        detail:
          $ref: "#/components/schemas/UpgradeRequiredPayload"
      required: [detail]

    SearchTradeHit:
      type: object
      properties:
        id: { type: integer }
        trade_id: { type: string, nullable: true }
