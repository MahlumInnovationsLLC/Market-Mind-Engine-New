        display_name: { type: string, nullable: true }
        approved: { type: boolean, nullable: true }
        is_admin: { type: boolean, nullable: true }
        last_seen_at: { type: string, nullable: true }
      required: [clerk_user_id]

    SearchAuditHit:
      type: object
      properties:
        id: { type: integer }
        action: { type: string, nullable: true }
        actor_email: { type: string, nullable: true }
        actor_user_id: { type: string, nullable: true }
        target_email: { type: string, nullable: true }
        target_user_id: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
      required: [id]

    SearchBillingHit:
      type: object
      description: >-
        Admin-only billing match. Carries either a stuck RevenueCat
        webhook event (`kind: "event"`) or a Stripe / RevenueCat
        customer row (`kind: "customer"`). The unused side's fields are
        nullable; the frontend renders the appropriate row layout off
        the discriminator.
      properties:
        kind:
          type: string
          enum: [event, customer]
          description: >-
            `event` → stuck RC webhook delivery; `customer` → Stripe
            or RC subscription row.
        provider:
          type: string
          nullable: true
          description: >-
            For `kind: "customer"`, one of `stripe` / `revenuecat`. For
            `kind: "event"`, always `revenuecat`.
        # Event fields ----------------------------------------------------
        event_id: { type: string, nullable: true }
        event_type: { type: string, nullable: true }
        last_failed_at:
          type: string
          nullable: true
          description: ISO-8601 timestamp of the most recent 5xx delivery.
        last_error: { type: string, nullable: true }
        attempts: { type: integer, nullable: true }
        # Customer fields -------------------------------------------------
        user_id:
          type: string
          nullable: true
          description: Clerk user id when known.
        app_user_id:
          type: string
          nullable: true
          description: RevenueCat app_user_id (mobile-only customers).
        email: { type: string, nullable: true }
        tier: { type: string, nullable: true }
        status: { type: string, nullable: true }
        stripe_customer_id: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }
      required: [kind]

    SearchResults:
      type: object
      properties:
        trades:
          type: array
          items: { $ref: "#/components/schemas/SearchTradeHit" }
        debates:
          type: array
          items: { $ref: "#/components/schemas/SearchDebateHit" }
        cycles:
          type: array
          items: { $ref: "#/components/schemas/SearchCycleHit" }
        users:
          type: array
          description: >-
            Admin-only matches against `app_users` (email / display name /
            clerk user id). Always present; empty for non-admin callers.
          items: { $ref: "#/components/schemas/SearchUserHit" }
        audit:
          type: array
          description: >-
            Admin-only matches against `admin_audit_log` (action /
            actor / target email / numeric id). Always present; empty
            for non-admin callers.
          items: { $ref: "#/components/schemas/SearchAuditHit" }
        billing:
          type: array
          description: >-
            Admin-only matches against `rc_webhook_deliveries` (latest
            5xx by event_id / error substring) and the Stripe /
            RevenueCat customer rows (lookup by email / clerk user id /
            stripe customer id). Always present; empty for non-admin
            callers.
          items: { $ref: "#/components/schemas/SearchBillingHit" }
      required: [trades, debates, cycles, users, audit, billing]

