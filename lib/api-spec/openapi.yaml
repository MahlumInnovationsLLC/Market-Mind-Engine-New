openapi: 3.1.0
info:
  # Do not change the title — generated import paths depend on it.
  title: Api
  version: 0.1.0
  description: Axiom-Predict API — backend for the prediction-market trading platform.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health and readiness
  - name: auth
    description: Authenticated-user metadata
  - name: dashboard
    description: Operator dashboard read-models
  - name: models
    description: Trained-model artifact discovery
  - name: swarm
    description: 6-persona LLM swarm + gatekeeper
  - name: orchestrator
    description: Trading cycle scheduler + 12-gate risk pipeline
  - name: admin
    description: Admin console — user role + approval management
paths:
  /me/access:
    get:
      operationId: getMyAccess
      tags: [auth]
      summary: Whether the signed-in user is approved for the operator console
      responses:
        "200":
          description: Approval status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyAccess" }

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /health:
    get:
      operationId: healthFull
      tags: [health]
      summary: Full readiness check (DB + Storage + secrets present)
      responses:
        "200":
          description: Health snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FullHealth" }

  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Top-level counts and lifetime KPIs from the production database
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardOverview" }

  /dashboard/recent-trades:
    get:
      operationId: getRecentTrades
      tags: [dashboard]
      summary: Most recent trades executed against Kalshi
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
      responses:
        "200":
          description: Recent trades
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeList" }

  /dashboard/swarm-personas:
    get:
      operationId: getSwarmPersonas
      tags: [dashboard]
      summary: Per-analyst Brier / accuracy / calibration metrics
      responses:
        "200":
          description: Swarm metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwarmPersonaList" }

  /dashboard/recent-cycles:
    get:
      operationId: getRecentCycles
      tags: [dashboard]
      summary: Most recent trading-loop cycles
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: Recent cycles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradingCycleList" }

  /dashboard/recent-debates:
    get:
      operationId: getRecentDebates
      tags: [dashboard]
      summary: Most recent 6-persona swarm debates
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: Recent debates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwarmDebateList" }

  /swarm/debate:
    post:
      operationId: runSwarmDebate
      tags: [swarm]
      summary: Run a 6-persona swarm debate against a candidate trade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwarmDebateRequest" }
      responses:
        "200":
          description: Debate result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwarmDebateResult" }

  /orchestrator/status:
    get:
      operationId: getOrchestratorStatus
      tags: [orchestrator]
      summary: Cycle scheduler status + last cycle summary per vertical
      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrchestratorStatus" }

  /orchestrator/run-cycle:
    post:
      operationId: runOrchestratorCycle
      tags: [orchestrator]
      summary: Manually fire a single trading cycle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrchestratorRunCycleRequest" }
      responses:
        "200":
          description: Cycle result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrchestratorCycleResult" }

  /settlement/status:
    get:
      operationId: getSettlementStatus
      tags: [settlement]
      summary: Settlement scheduler status + last cycle summary
      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementStatus" }

  /settlement/run-cycle:
    post:
      operationId: runSettlementCycle
      tags: [settlement]
      summary: Manually trigger one settlement sweep
      responses:
        "200":
          description: Cycle result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementCycleResult" }

  /settlement/settle-market:
    post:
      operationId: settleMarket
      tags: [settlement]
      summary: Manual / backfill settlement of a single market
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettleMarketRequest" }
      responses:
        "200":
          description: Settlement result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettleMarketResult" }

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List every user the system has seen sign in
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserList" }

  /admin/users/{clerk_user_id}:
    get:
      operationId: adminGetUser
      tags: [admin]
      summary: Detail view for a single user
      parameters:
        - in: path
          name: clerk_user_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }

  /admin/users/{clerk_user_id}/approved:
    post:
      operationId: adminSetUserApproved
      tags: [admin]
      summary: Approve or revoke operator access for a user
      parameters:
        - in: path
          name: clerk_user_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSetApprovedRequest" }
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSetFlagResult" }

  /admin/users/{clerk_user_id}/admin:
    post:
      operationId: adminSetUserAdmin
      tags: [admin]
      summary: Promote or demote a user to admin
      parameters:
        - in: path
          name: clerk_user_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSetAdminRequest" }
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSetFlagResult" }

  /admin/audit-log:
    get:
      operationId: adminGetAuditLog
      tags: [admin]
      summary: Recent admin role / approval audit entries
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Audit log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditLogList" }

  /models/inventory:
    get:
      operationId: getModelsInventory
      tags: [models]
      summary: Trained-model archive inventory in Supabase Storage
      responses:
        "200":
          description: Storage inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelsInventory" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    MyAccess:
      type: object
      properties:
        approved: { type: boolean }
        is_admin: { type: boolean }
        email: { type: string, nullable: true }
        user_id: { type: string }
      required: [approved, is_admin, user_id]

    SecretsPresent:
      type: object
      properties:
        openai: { type: boolean }
        anthropic: { type: boolean }
        kalshi: { type: boolean }
      required: [openai, anthropic, kalshi]

    PostgresHealth:
      type: object
      properties:
        ok: { type: boolean }
        version: { type: string, nullable: true }
        public_tables: { type: integer, nullable: true }
        error: { type: string, nullable: true }
      required: [ok]

    StorageSampleEntry:
      type: object
      properties:
        name: { type: string }
        folder: { type: boolean }
      required: [name, folder]

    StorageHealth:
      type: object
      properties:
        ok: { type: boolean }
        bucket: { type: string, nullable: true }
        sample:
          type: array
          items: { $ref: "#/components/schemas/StorageSampleEntry" }
        error: { type: string, nullable: true }
      required: [ok]

    FullHealth:
      type: object
      properties:
        status: { type: string }
        supabase_project: { type: string }
        paper_mode: { type: boolean }
        kalshi_env: { type: string }
        secrets_present: { $ref: "#/components/schemas/SecretsPresent" }
        postgres: { $ref: "#/components/schemas/PostgresHealth" }
        storage: { $ref: "#/components/schemas/StorageHealth" }
      required: [status, supabase_project, paper_mode, kalshi_env, secrets_present]

    DashboardCounts:
      type: object
      properties:
        trading_cycles: { type: integer, nullable: true }
        trades: { type: integer, nullable: true }
        swarm_debates: { type: integer, nullable: true }
        ml_training_logs: { type: integer, nullable: true }
        predictions: { type: integer, nullable: true }
        positions: { type: integer, nullable: true }

    DashboardOverview:
      type: object
      properties:
        counts: { $ref: "#/components/schemas/DashboardCounts" }
        latest_cycle_at: { type: string, nullable: true }
        latest_trade_at: { type: string, nullable: true }
        realized_pnl: { type: number, nullable: true }
        win_rate: { type: number, nullable: true }
        open_positions: { type: integer, nullable: true }
      required: [counts]

    Trade:
      type: object
      properties:
        id: { type: integer }
        trade_id: { type: string, nullable: true }
        market_id: { type: string, nullable: true }
        vertical: { type: string, nullable: true }
        league: { type: string, nullable: true }
        side: { type: string, nullable: true }
        action: { type: string, nullable: true }
        quantity: { type: number, nullable: true }
        price: { type: number, nullable: true }
        fees: { type: number, nullable: true }
        pnl: { type: number, nullable: true }
        trading_mode: { type: string, nullable: true }
        exchange: { type: string, nullable: true }
        executed_at: { type: string, nullable: true }
      required: [id]

    TradeList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Trade" }
      required: [items]

    SwarmPersona:
      type: object
      properties:
        persona: { type: string, nullable: true }
        league: { type: string, nullable: true }
        market_type: { type: string, nullable: true }
        n: { type: integer, nullable: true }
        correct: { type: integer, nullable: true }
        brier: { type: number, nullable: true }
        calibration_error: { type: number, nullable: true }
        accuracy: { type: number, nullable: true }
        avg_confidence: { type: number, nullable: true }
        updated_at: { type: string, nullable: true }

    SwarmPersonaList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SwarmPersona" }
      required: [items]

    TradingCycle:
      type: object
      properties:
        id: { type: integer }
        vertical: { type: string, nullable: true }
        picks_evaluated: { type: integer, nullable: true }
        trades_placed: { type: integer, nullable: true }
        errors: { type: string, nullable: true }
        started_at: { type: string, nullable: true }
        completed_at: { type: string, nullable: true }
        duration_seconds: { type: number, nullable: true }
      required: [id]

    TradingCycleList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TradingCycle" }
      required: [items]

    SwarmDebate:
      type: object
      properties:
        id: { type: integer }
        league: { type: string, nullable: true }
        matchup: { type: string, nullable: true }
        market_type: { type: string, nullable: true }
        consensus_probability: { type: number, nullable: true }
        confidence_band_low: { type: number, nullable: true }
        confidence_band_high: { type: number, nullable: true }
        agreement_rate: { type: number, nullable: true }
        approved: { type: boolean, nullable: true }
        recommended_action: { type: string, nullable: true }
        outcome: { type: string, nullable: true }
        cost_estimate: { type: number, nullable: true }
        latency_ms: { type: number, nullable: true }
        created_at: { type: string, nullable: true }
      required: [id]

    SwarmDebateList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SwarmDebate" }
      required: [items]

    StorageFile:
      type: object
      properties:
        name: { type: string }
        size: { type: integer, nullable: true }
        updated_at: { type: string, nullable: true }
      required: [name]

    StorageBucketEntry:
      type: object
      properties:
        name: { type: string }
        is_folder: { type: boolean }
      required: [name, is_folder]

    ExportsInventory:
      type: object
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/StorageFile" }
        models_archive_total_bytes: { type: integer }
        source_archive_total_bytes: { type: integer }
      required: [files, models_archive_total_bytes, source_archive_total_bytes]

    OrchestratorStatus:
      type: object
      properties:
        enabled: { type: boolean }
        running: { type: boolean }
        trading_mode: { type: string }
        cycle_interval_seconds: { type: integer }
        verticals:
          type: array
          items: { type: string }
        last_cycle:
          type: object
          additionalProperties: true

    OrchestratorRunCycleRequest:
      type: object
      properties:
        vertical: { type: string, default: "sports" }
      required: [vertical]

    OrchestratorCycleResult:
      type: object
      properties:
        cycle_id: { type: integer, nullable: true }
        vertical: { type: string }
        started_at: { type: string }
        completed_at: { type: string, nullable: true }
        duration_seconds: { type: number }
        picks_evaluated: { type: integer }
        trades_placed: { type: integer }
        fresh_debates: { type: integer }
        errors:
          type: array
          items: { type: string }
      required: [vertical, started_at, picks_evaluated, trades_placed, fresh_debates, duration_seconds]

    SettlementStatus:
      type: object
      properties:
        enabled: { type: boolean }
        running: { type: boolean }
        interval_seconds: { type: integer }
        last_cycle:
          type: object
          additionalProperties: true

    SettlementCycleResult:
      type: object
      properties:
        started_at: { type: string }
        completed_at: { type: string, nullable: true }
        duration_seconds: { type: number }
        markets_examined: { type: integer }
        markets_settled: { type: integer }
        trades_settled: { type: integer }
        persona_metrics_updated: { type: integer }
        alerts_raised: { type: integer }
        errors:
          type: array
          items: { type: string }
      required: [started_at, duration_seconds, markets_examined, markets_settled, trades_settled, persona_metrics_updated, alerts_raised, errors]

    SettleMarketRequest:
      type: object
      properties:
        market_id: { type: string, minLength: 1 }
        outcome_yes:
          type: integer
          enum: [0, 1]
          description: "1 if YES side wins, 0 if NO side wins"
        settle_price:
          type: number
          nullable: true
          description: "Optional final settlement price (cents 0-100 or unit 0-1)"
      required: [market_id, outcome_yes]

    SettleMarketResult:
      type: object
      properties:
        market_id: { type: string }
        outcome_yes: { type: integer, enum: [0, 1] }
        trades_settled: { type: integer }
        persona_metrics_updated: { type: integer }
        alerts_raised: { type: integer }
        verticals:
          type: array
          items: { type: string }
      required: [market_id, outcome_yes, trades_settled, persona_metrics_updated, alerts_raised, verticals]

    SwarmDebateRequest:
      type: object
      properties:
        game_id: { type: string }
        matchup: { type: string, nullable: true }
        league: { type: string, nullable: true }
        market_type: { type: string, nullable: true }
        side: { type: string, nullable: true }
        current_price: { type: number, nullable: true }
        context: { type: string, nullable: true }
        aggression_mode:
          type: string
          nullable: true
          description: "conservative | balanced | aggressive"
      required: [game_id]

    SwarmPersonaVerdict:
      type: object
      properties:
        persona: { type: string }
        provider: { type: string }
        model: { type: string }
        probability: { type: number, nullable: true }
        confidence: { type: number, nullable: true }
        lean: { type: string }
        reasoning: { type: string, nullable: true }
        weight: { type: number, nullable: true }
        latency_ms: { type: integer, nullable: true }
        cost: { type: number, nullable: true }
        input_tokens: { type: integer, nullable: true }
        output_tokens: { type: integer, nullable: true }
        error: { type: string, nullable: true }

    SwarmDebateTranscript:
      type: object
      properties:
        personas:
          type: array
          items: { $ref: "#/components/schemas/SwarmPersonaVerdict" }
        moderator: { $ref: "#/components/schemas/SwarmPersonaVerdict" }
        gatekeeper: { $ref: "#/components/schemas/SwarmPersonaVerdict" }

    SwarmDebateResult:
      type: object
      properties:
        debate_id: { type: integer, nullable: true }
        game_id: { type: string }
        matchup: { type: string, nullable: true }
        league: { type: string, nullable: true }
        market_type: { type: string, nullable: true }
        aggression_mode: { type: string, nullable: true }
        consensus_probability: { type: number, nullable: true }
        confidence_band_low: { type: number, nullable: true }
        confidence_band_high: { type: number, nullable: true }
        agreement_rate: { type: number, nullable: true }
        approved: { type: boolean }
        recommended_action: { type: string }
        cost_estimate: { type: number, nullable: true }
        latency_ms: { type: integer, nullable: true }
        transcript: { $ref: "#/components/schemas/SwarmDebateTranscript" }
      required: [game_id, approved, recommended_action]

    ModelsInventory:
      type: object
      properties:
        buckets:
          type: array
          items: { $ref: "#/components/schemas/StorageBucketEntry" }
        exports: { $ref: "#/components/schemas/ExportsInventory" }
        cutover:
          type: array
          items: { $ref: "#/components/schemas/StorageFile" }
      required: [buckets, exports, cutover]

    AdminUser:
      type: object
      properties:
        clerk_user_id: { type: string }
        email: { type: string, nullable: true }
        display_name: { type: string, nullable: true }
        approved: { type: boolean }
        is_admin: { type: boolean }
        first_seen_at: { type: string, nullable: true }
        last_seen_at: { type: string, nullable: true }
        activity_count: { type: integer }
        clerk_created_at: { type: string, nullable: true }
        clerk_last_sign_in_at: { type: string, nullable: true }
      required: [clerk_user_id, approved, is_admin, activity_count]

    AdminUserList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
      required: [items]

    AdminClerkProfile:
      type: object
      additionalProperties: true

    AdminUserDetail:
      type: object
      properties:
        clerk_user_id: { type: string }
        email: { type: string, nullable: true }
        display_name: { type: string, nullable: true }
        approved: { type: boolean }
        is_admin: { type: boolean }
        activity_count: { type: integer }
        first_seen_at: { type: string, nullable: true }
        last_seen_at: { type: string, nullable: true }
        approval_source: { type: string }
        clerk_profile: { $ref: "#/components/schemas/AdminClerkProfile" }
      required: [clerk_user_id, approved, is_admin, activity_count, approval_source]

    AdminSetApprovedRequest:
      type: object
      properties:
        approved: { type: boolean }
      required: [approved]

    AdminSetAdminRequest:
      type: object
      properties:
        is_admin: { type: boolean }
      required: [is_admin]

    AdminSetFlagResult:
      type: object
      properties:
        clerk_user_id: { type: string }
        approved: { type: boolean }
        is_admin: { type: boolean }
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
      required: [clerk_user_id, approved, is_admin]

    AdminAuditLogEntry:
      type: object
      properties:
        id: { type: integer }
        actor_user_id: { type: string }
        actor_email: { type: string, nullable: true }
        target_user_id: { type: string }
        target_email: { type: string, nullable: true }
        action: { type: string }
        before_value:
          type: object
          additionalProperties: true
          nullable: true
        after_value:
          type: object
          additionalProperties: true
          nullable: true
        created_at: { type: string, nullable: true }
      required: [id, actor_user_id, target_user_id, action]

    AdminAuditLogList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminAuditLogEntry" }
      required: [items]
