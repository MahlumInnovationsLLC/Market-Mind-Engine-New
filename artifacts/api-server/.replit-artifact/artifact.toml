kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.run]
args = [
  "/home/runner/workspace/.pythonlibs/bin/python3",
  "-m",
  "uvicorn",
  "app.main:app",
  "--host",
  "0.0.0.0",
  "--port",
  "8080",
  "--app-dir",
  "/home/runner/workspace/artifacts/api-server",
]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
