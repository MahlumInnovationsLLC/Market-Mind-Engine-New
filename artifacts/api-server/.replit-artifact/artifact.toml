kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.run]
# Production entrypoint.  All logic lives in ``scripts/start-prod.sh``
# (background chromium install + watchdog-supervised uvicorn).  The
# inline ``sh -c`` form that lived here previously caused the Reserved
# VM (gce) promote step to hang at "Waiting for deployment to be
# ready" -- the pid 1 supervisor on VM appears not to handle the
# backgrounded subshell + ``exec`` pattern the same way Cloud Run does.
# A real script file keeps the quoting auditable and the process tree
# simple.
args = ["/bin/sh", "/home/runner/workspace/artifacts/api-server/scripts/start-prod.sh"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
