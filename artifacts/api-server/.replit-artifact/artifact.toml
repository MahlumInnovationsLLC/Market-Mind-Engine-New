kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Install Playwright's chromium binary so the edge_terminal scraper has
# a browser to drive in production. Without this, every poller tick logs
# ``unavailable: chromium launch failed: Executable doesn't exist`` and
# zero signals/trades fire. System libs (libgbm, nss, dbus, ...) are
# already provided by replit.nix.
args = [
  "/home/runner/workspace/.pythonlibs/bin/python3",
  "-m",
  "playwright",
  "install",
  "chromium",
]

[services.production.run]
# L1 (this process supervisor) -> L2 (watchdog) -> uvicorn child.
# The watchdog polls /api/healthz on port 8080 every 5s and restarts
# uvicorn after 3 consecutive failures, with restart-storm rate limiting.
# It also exposes a status endpoint on port 8099.
args = [
  "/home/runner/workspace/.pythonlibs/bin/python3",
  "/home/runner/workspace/artifacts/api-server/scripts/watchdog.py",
  "--supervise",
  "--target",
  "http://127.0.0.1:8080/api/healthz",
  "--",
  "/home/runner/workspace/.pythonlibs/bin/python3",
  "-m",
  "uvicorn",
  "app.main:app",
  "--host",
  "0.0.0.0",
  "--port",
  "8080",
  "--app-dir",
  "/home/runner/workspace/artifacts/api-server",
]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
