name: gh-pages-prune

# Prune old CI failure HTML reports from the `gh-pages` branch so it doesn't
# grow unboundedly. The companion publishers write reports under:
#   pr-<number>/run-<runid>/                       # web Playwright (web-e2e.yml)
#   branch-<sanitized>/run-<runid>/                # web Playwright (push / workflow_dispatch)
#   api/pr-<number>/run-<runid>/                   # API pytest (api-pytest.yml)
#   api/branch-<sanitized>/run-<runid>/            # API pytest (push / workflow_dispatch)
#   coverage/web/pr-<number>/run-<runid>/          # web vitest HTML coverage (frontend-coverage-comment.yml)
#   coverage/mobile/pr-<number>/run-<runid>/       # mobile jest HTML coverage (frontend-coverage-comment.yml)
#
# This workflow:
#   * On `pull_request.closed`, immediately deletes `pr-<n>/`,
#     `api/pr-<n>/`, `coverage/web/pr-<n>/` and `coverage/mobile/pr-<n>/`
#     for the PR that just closed — no age gating.
#   * On the daily schedule, also removes `pr-<n>/`, `api/pr-<n>/`,
#     `coverage/web/pr-<n>/` and `coverage/mobile/pr-<n>/` directories
#     for PRs that were merged or closed more than PR_MAX_AGE_DAYS ago
#     (default: 14). This catches PRs whose close event was missed
#     (e.g. if this workflow was disabled at the time).
#   * Caps each per-PR / per-branch run-tree (web Playwright, API pytest,
#     and frontend coverage variants) to the most recent RUNS_PER_DIR
#     run subdirectories (default: 20), deleting older ones.
#   * Re-renders the gh-pages landing-page `index.html` so it no longer
#     points at any reports that were just pruned.

on:
  schedule:
    # Daily at 04:17 UTC. Off-peak, and odd-minute to avoid the top-of-hour
    # GitHub Actions runner contention.
    - cron: "17 4 * * *"
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_max_age_days:
        description: "Delete pr-<n>/ dirs for PRs closed/merged more than this many days ago."
        required: false
        default: "14"
      runs_per_dir:
        description: "Keep only the most recent N run-<id>/ subdirectories per pr-/branch- dir."
        required: false
        default: "20"

concurrency:
  # Serialize prunes so two runs don't race on the same branch push.
  group: gh-pages-prune
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    name: Prune old CI reports
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PR_MAX_AGE_DAYS: ${{ github.event.inputs.pr_max_age_days || '14' }}
      RUNS_PER_DIR: ${{ github.event.inputs.runs_per_dir || '20' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # When this run was triggered by a PR being closed/merged, the
      # PR number is exposed here so the prune step can immediately
      # delete `pr-<n>/` and `api/pr-<n>/` for that PR (bypassing the
      # PR_MAX_AGE_DAYS gate). Empty for scheduled / manual runs.
      CLOSED_PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.number || '' }}
      # Namespaces under which `pr-<n>/` and `branch-<sanitized>/` trees
      # live on `gh-pages`. Empty string means the gh-pages root (web
      # Playwright). Each prefix gets the same per-PR / per-branch
      # treatment as the others, so adding a new publisher is just a
      # matter of appending to this list (plus the publisher and the
      # corresponding line in `EMPTY_NAMESPACES` below).
      REPORT_NAMESPACES: "api/ coverage/web/ coverage/mobile/"
      # Subset of REPORT_NAMESPACES whose container directory should
      # itself be removed when it ends up empty after pruning, so the
      # gh-pages root stays tidy. Walked deepest-first.
      EMPTY_NAMESPACES: "api coverage/web coverage/mobile coverage"

    steps:
      - name: Check out repo (for the index renderer)
        uses: actions/checkout@v4
        with:
          # We only need .github/scripts/render-gh-pages-index.py; a shallow
          # clone of the default branch is plenty.
          fetch-depth: 1

      - name: Check out gh-pages (if it exists)
        id: checkout
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --heads "${REPO_URL}" gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch does not exist; nothing to prune."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          WORK="$(mktemp -d)"
          git clone --depth=1 --branch=gh-pages "${REPO_URL}" "${WORK}"
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "work=${WORK}" >> "$GITHUB_OUTPUT"

      - name: Prune + render + push
        if: steps.checkout.outputs.exists == 'true'
        env:
          WORK: ${{ steps.checkout.outputs.work }}
        run: |
          set -euo pipefail

          # Compute the prune deletions against whatever is currently on
          # disk in ${WORK}, then re-render the landing-page index so it
          # no longer points at removed reports. Returns 0 (truthy) if a
          # commit was created and needs pushing, 1 otherwise. Called
          # once before the first push and again after each
          # reset-to-origin retry, since the deletions are deterministic
          # against the fresh state.
          prune_and_commit() {
            local NOW_TS MAX_AGE_SEC ns dir base pr_num api_path resp state \
                  closed_at closed_ts age parent runs count i victim \
                  pr_dirs cap_dirs empty_ns CHANGES=0 HAD_DIFF
            NOW_TS="$(date -u +%s)"
            MAX_AGE_SEC=$(( PR_MAX_AGE_DAYS * 86400 ))

            pushd "${WORK}" >/dev/null
            shopt -s nullglob

            # The web Playwright reports live at the gh-pages root
            # (empty namespace); everything else lives under one of the
            # `${REPORT_NAMESPACES}` prefixes. Build the union here so
            # all three sweeps below walk the same set of trees.
            local namespaces=("" ${REPORT_NAMESPACES})

            # ---- 0. Immediate cleanup for the PR that just closed ----
            # When triggered by a `pull_request.closed` event, drop the
            # closing PR's report dirs right away — no age gating. This
            # keeps merged-PR reports from sitting around for up to
            # PR_MAX_AGE_DAYS before the scheduled sweep notices them.
            if [ -n "${CLOSED_PR_NUMBER:-}" ]; then
              for ns in "${namespaces[@]}"; do
                dir="${ns}pr-${CLOSED_PR_NUMBER}/"
                if [ -d "${dir}" ]; then
                  echo "Removing ${dir} (PR #${CLOSED_PR_NUMBER} just closed)."
                  git rm -rf --quiet "${dir}"
                  CHANGES=$(( CHANGES + 1 ))
                fi
              done
            fi

            # ---- 1. Prune pr-<n>/ dirs for old closed/merged PRs ------
            # Ask the GitHub API for each PR's state + closed_at. If
            # the PR is closed/merged and was closed more than
            # PR_MAX_AGE_DAYS ago, delete the whole pr-<n>/ tree. Open
            # or unknown PRs are left alone. All `pr-*/` trees across
            # every namespace are walked together.
            pr_dirs=()
            for ns in "${namespaces[@]}"; do
              for dir in "${ns}"pr-*/; do
                [ -d "${dir}" ] && pr_dirs+=("${dir}")
              done
            done
            for dir in "${pr_dirs[@]}"; do
              base="${dir%/}"             # strip trailing slash
              pr_num="${base##*pr-}"      # strip everything up to "pr-"
              case "${pr_num}" in
                ''|*[!0-9]*)
                  echo "Skipping non-numeric PR dir: ${dir}"
                  continue
                  ;;
              esac

              api_path="repos/${GITHUB_REPOSITORY}/pulls/${pr_num}"
              if ! resp="$(gh api "${api_path}" 2>/dev/null)"; then
                echo "Could not fetch PR #${pr_num}; leaving ${dir} in place."
                continue
              fi

              state="$(printf '%s' "${resp}" | jq -r '.state // "unknown"')"
              closed_at="$(printf '%s' "${resp}" | jq -r '.closed_at // empty')"

              if [ "${state}" != "closed" ] || [ -z "${closed_at}" ]; then
                continue
              fi

              closed_ts="$(date -u -d "${closed_at}" +%s 2>/dev/null || echo 0)"
              age=$(( NOW_TS - closed_ts ))
              if [ "${age}" -lt "${MAX_AGE_SEC}" ]; then
                echo "PR #${pr_num} closed ${age}s ago (< ${MAX_AGE_SEC}s); keeping ${dir}."
                continue
              fi

              echo "Removing ${dir} (PR #${pr_num} closed ${age}s ago)."
              git rm -rf --quiet "${dir}"
              CHANGES=$(( CHANGES + 1 ))
            done

            # ---- 2. Cap each remaining pr-/branch- dir to RUNS_PER_DIR ----
            # Same treatment for every namespace: web Playwright
            # (`pr-*/`, `branch-*/`), API pytest (`api/pr-*/`,
            # `api/branch-*/`), and frontend coverage
            # (`coverage/web/pr-*/`, `coverage/mobile/pr-*/`, …).
            cap_dirs=()
            for ns in "${namespaces[@]}"; do
              for parent in "${ns}"pr-*/ "${ns}"branch-*/; do
                [ -d "${parent}" ] && cap_dirs+=("${parent}")
              done
            done
            for parent in "${cap_dirs[@]}"; do
              # List run-<id>/ subdirs sorted by id descending. Run
              # IDs are monotonically increasing per repo, so newest
              # IDs == newest runs.
              mapfile -t runs < <(
                find "${parent}" -mindepth 1 -maxdepth 1 -type d -name 'run-*' \
                  -printf '%f\n' \
                  | sort -t- -k2,2nr
              )
              count="${#runs[@]}"
              if [ "${count}" -le "${RUNS_PER_DIR}" ]; then
                continue
              fi
              echo "${parent}: ${count} runs > cap ${RUNS_PER_DIR}; trimming."
              for ((i = RUNS_PER_DIR; i < count; i++)); do
                victim="${parent}${runs[$i]}"
                echo "  remove ${victim}"
                git rm -rf --quiet "${victim}"
                CHANGES=$(( CHANGES + 1 ))
              done

              if [ -z "$(ls -A "${parent}" 2>/dev/null)" ]; then
                echo "  parent ${parent} is now empty; removing."
                rmdir "${parent}" 2>/dev/null || true
              fi
            done

            # If a namespace container directory itself is now empty,
            # drop it too so the gh-pages root stays tidy. Walked in
            # the order given so deeper paths (e.g. `coverage/web`)
            # disappear before their parents (`coverage`).
            for empty_ns in ${EMPTY_NAMESPACES}; do
              if [ -d "${empty_ns}" ] && [ -z "$(ls -A "${empty_ns}" 2>/dev/null)" ]; then
                echo "  ${empty_ns}/ is now empty; removing."
                rmdir "${empty_ns}" 2>/dev/null || true
              fi
            done

            shopt -u nullglob
            popd >/dev/null

            if [ "${CHANGES}" -eq 0 ]; then
              echo "No reports needed pruning."
              return 0
            fi

            # Re-render the index against the post-prune tree.
            python3 "${GITHUB_WORKSPACE}/.github/scripts/render-gh-pages-index.py" "${WORK}"

            pushd "${WORK}" >/dev/null
            git add index.html
            if git diff --cached --quiet; then
              # No staged changes after all (deletions and re-render
              # cancelled out). Nothing to commit.
              HAD_DIFF=0
            else
              git -c user.name='github-actions[bot]' \
                  -c user.email='github-actions[bot]@users.noreply.github.com' \
                  commit -m "Prune old CI reports (${CHANGES} entries)"
              HAD_DIFF=1
            fi
            popd >/dev/null

            [ "${HAD_DIFF}" -eq 1 ]
          }

          # First pass: nothing to commit means nothing to push.
          if ! prune_and_commit; then
            echo "Index already in sync; nothing to push."
            exit 0
          fi

          # Push with retry-on-conflict. Re-fetch + reset + re-prune
          # against the new origin tip rather than rebasing generated
          # HTML on top of someone else's generated HTML.
          attempt=0
          MAX_ATTEMPTS=5
          until (cd "${WORK}" && git push origin gh-pages); do
            attempt=$((attempt + 1))
            if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
              echo "::error::Failed to push gh-pages after ${attempt} attempts."
              exit 1
            fi
            echo "::warning::Push attempt ${attempt} failed; resyncing with origin/gh-pages."
            (
              cd "${WORK}"
              git fetch --depth=1 origin gh-pages
              git reset --hard FETCH_HEAD
            )
            if ! prune_and_commit; then
              # Nothing left to prune after the resync; the concurrent
              # publisher already left us in a consistent state.
              echo "Nothing left to prune after resync; done."
              exit 0
            fi
            sleep $(( attempt * 2 ))
          done
