name: mobile-jest

# Runs the mobile artifact's jest unit suite (jest-expo preset) with
# Istanbul coverage. The raw `coverage-summary.json` is uploaded as a
# workflow artifact; the companion `frontend-coverage-comment` workflow
# downloads it via `workflow_run`, computes a delta vs. the baseline
# stored on the `js-coverage-data` branch, and posts / updates a sticky
# PR comment.
#
# See `web-vitest.yml` for the rationale behind the split-job design.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-jest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jest:
    name: Jest (mobile unit + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Run jest with coverage
        run: pnpm --filter @workspace/mobile run test:coverage

      - name: Upload coverage summary for the commenter workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-jest-coverage
          path: |
            artifacts/mobile/coverage/coverage-summary.json
            artifacts/mobile/coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-jest-coverage-html
          path: artifacts/mobile/coverage
          if-no-files-found: ignore
          retention-days: 14
