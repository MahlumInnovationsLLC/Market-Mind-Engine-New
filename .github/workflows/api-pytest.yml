name: api-pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: api-pytest-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` lets us push the rendered pytest HTML report to the
# `gh-pages` branch on failure; `pull-requests: write` lets us post a sticky
# comment on the PR with a link to that report. Both default to read-only,
# so we have to opt in here.
permissions:
  contents: write
  pull-requests: write

jobs:
  pytest:
    name: FastAPI pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps (FastAPI + asyncpg + …)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest-cov pytest-html

      - name: Run pytest
        working-directory: artifacts/api-server
        run: |
          mkdir -p /tmp/pytest-report
          python -m pytest tests/ \
            -n auto \
            --dist loadfile \
            --junitxml=/tmp/pytest-junit.xml \
            --cov=app \
            --cov-report=xml:/tmp/pytest-coverage.xml \
            --cov-report=html:/tmp/pytest-report/coverage \
            --cov-report=term \
            --html=/tmp/pytest-report/index.html \
            --self-contained-html \
            -v

      - name: Stage .coverage for the commenter workflow
        if: always()
        run: |
          if [ -f artifacts/api-server/.coverage ]; then
            cp artifacts/api-server/.coverage "$GITHUB_WORKSPACE/.coverage"
          fi

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            /tmp/pytest-junit.xml
            /tmp/pytest-coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload raw coverage data for the commenter workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-pytest-coverage-data
          path: |
            .coverage
            /tmp/pytest-coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload pytest HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: /tmp/pytest-report
          if-no-files-found: ignore
          retention-days: 14

      # ----------------------------------------------------------------------
      # On failure, publish the pytest HTML report (and HTML coverage) to the
      # `gh-pages` branch under `api/pr-<number>/run-<runid>/` (or
      # `api/branch-<sanitized>/...` for non-PR runs) and post a sticky PR
      # comment linking to it. Mirrors the pattern used by web-e2e.yml so
      # debugging API failures is just as quick as web ones.
      #
      # The `api/` prefix namespaces these reports so they can't collide with
      # the web Playwright reports that live at the gh-pages root.
      #
      # Requires GitHub Pages to be enabled for the repo with source set to
      # the `gh-pages` branch (Settings → Pages). The first failed run will
      # initialize the branch automatically.
      # ----------------------------------------------------------------------
      - name: Publish pytest HTML report to gh-pages
        if: failure()
        id: publish-report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/pytest-report/index.html ]; then
            echo "No HTML report on disk; skipping publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${PR_NUMBER}" ]; then
            SUBDIR="api/pr-${PR_NUMBER}/run-${RUN_ID}"
          else
            SAFE_REF="$(printf '%s' "${REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')"
            SUBDIR="api/branch-${SAFE_REF}/run-${RUN_ID}"
          fi

          WORK="$(mktemp -d)"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "${REPO_URL}" gh-pages >/dev/null 2>&1; then
            git clone --depth=1 --branch=gh-pages "${REPO_URL}" "${WORK}"
          else
            echo "gh-pages branch does not exist yet; initializing it."
            git clone --depth=1 "${REPO_URL}" "${WORK}"
            (
              cd "${WORK}"
              git checkout --orphan gh-pages
              git rm -rf . >/dev/null 2>&1 || true
              cat > index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>CI reports</title>
          <h1>CI reports</h1>
          <p>Per-run HTML reports live under <code>pr-&lt;number&gt;/run-&lt;id&gt;/</code>
          (web Playwright) and <code>api/pr-&lt;number&gt;/run-&lt;id&gt;/</code> (API pytest).</p>
          HTML
              git add index.html
              git -c user.name='github-actions[bot]' \
                  -c user.email='github-actions[bot]@users.noreply.github.com' \
                  commit -m "Initialize gh-pages for CI reports"
              git push -u origin gh-pages
            )
          fi

          mkdir -p "${WORK}/${SUBDIR}"
          cp -R /tmp/pytest-report/. "${WORK}/${SUBDIR}/"

          (
            cd "${WORK}"
            git add "${SUBDIR}"
            git -c user.name='github-actions[bot]' \
                -c user.email='github-actions[bot]@users.noreply.github.com' \
                commit -m "Publish pytest report: ${SUBDIR}"
            # Retry the push once if a concurrent run raced us.
            git push origin gh-pages || (git pull --rebase origin gh-pages && git push origin gh-pages)
          )

          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          REPORT_URL="https://${OWNER}.github.io/${REPO}/${SUBDIR}/"
          COVERAGE_URL="https://${OWNER}.github.io/${REPO}/${SUBDIR}/coverage/"
          echo "Report published to: ${REPORT_URL}"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "report_url=${REPORT_URL}" >> "$GITHUB_OUTPUT"
          echo "coverage_url=${COVERAGE_URL}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR with report link
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_URL: ${{ steps.publish-report.outputs.report_url }}
          COVERAGE_URL: ${{ steps.publish-report.outputs.coverage_url }}
          REPORT_PUBLISHED: ${{ steps.publish-report.outputs.published }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const runId = context.runId;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const reportUrl = process.env.REPORT_URL;
            const coverageUrl = process.env.COVERAGE_URL;
            const published = process.env.REPORT_PUBLISHED === 'true';

            // Walk the JUnit XML and collect the names of tests that did
            // not pass (failures + errors). Skipped tests are ignored.
            const failures = [];
            try {
              const raw = fs.readFileSync('/tmp/pytest-junit.xml', 'utf8');
              const re = /<testcase\b([^>]*)>([\s\S]*?)<\/testcase>|<testcase\b([^/]*)\/>/g;
              let m;
              while ((m = re.exec(raw)) !== null) {
                const attrs = m[1] || m[3] || '';
                const inner = m[2] || '';
                if (!/<(failure|error)\b/.test(inner)) continue;
                const cls = (attrs.match(/classname="([^"]*)"/) || [])[1] || '';
                const name = (attrs.match(/\sname="([^"]*)"/) || [])[1] || '';
                failures.push(cls ? `${cls}::${name}` : name);
              }
            } catch (err) {
              core.warning(`Could not parse pytest JUnit report: ${err.message}`);
            }

            const marker = '<!-- api-pytest-report-comment -->';
            const lines = [marker, '### API pytest suite failed', ''];
            if (published && reportUrl) {
              lines.push(`**HTML report:** ${reportUrl}`);
              if (coverageUrl) {
                lines.push(`**Coverage report:** ${coverageUrl}`);
              }
            } else {
              lines.push('**HTML report:** not available (download the `pytest-html-report` artifact from the run instead).');
            }
            lines.push(`**Workflow run:** ${runUrl}`);
            lines.push('');
            if (failures.length) {
              lines.push(`**Failing tests (${failures.length}):**`);
              const shown = failures.slice(0, 25);
              for (const name of shown) lines.push(`- \`${name}\``);
              if (failures.length > shown.length) {
                lines.push(`- _…and ${failures.length - shown.length} more — see the report._`);
              }
            } else {
              lines.push('_No individual test failures parsed; the job itself failed (install, collection, etc.). Check the run logs._');
            }
            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(
              c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body });
            }
