name: web-e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` lets us push the rendered Playwright HTML report to the
# `gh-pages` branch on failure; `pull-requests: write` lets us post a sticky
# comment on the PR with a link to that report. Both default to read-only,
# so we have to opt in here.
permissions:
  contents: write
  pull-requests: write

jobs:
  playwright:
    name: Playwright (operator + admin)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      # Web preview / Vite — `PORT` is read by `vite.config.ts` at config
      # load time (it throws if unset), so we expose it job-wide so both
      # the build step and the preview step pick it up.
      PORT: "5173"
      WEB_PORT: "5173"
      BASE_PATH: "/"
      # API server (FastAPI) — must match what the web app talks to.
      API_PORT: "8080"
      # Where Playwright points its browser.
      E2E_BASE_URL: "http://localhost:5173"

      # Clerk dev-instance credentials. These are passwordless dev keys
      # used only by Clerk's testing helper; they are NOT prod keys.
      CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}

      # Test-user emails (passwordless ticket strategy — Clerk mints
      # the sign-in token, no password required).
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      E2E_CLERK_ADMIN_EMAIL: ${{ secrets.E2E_CLERK_ADMIN_EMAIL }}
      E2E_CLERK_ADMIN_PASSWORD: ${{ secrets.E2E_CLERK_ADMIN_PASSWORD }}

      # Backend secrets the API server needs to come up + serve auth-
      # gated dashboard data. Auth-gated tests skip themselves if these
      # are absent, so the public-surface matrix still runs without them.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPERATOR_ALLOWED_EMAILS: ${{ secrets.OPERATOR_ALLOWED_EMAILS }}
      OPERATOR_ADMIN_EMAILS: ${{ secrets.OPERATOR_ADMIN_EMAILS }}
      AXIOM_CORS_ORIGINS: "*"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps (FastAPI + asyncpg + …)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (+ system libs)
        run: pnpm --filter @workspace/web exec playwright install --with-deps chromium

      - name: Build web bundle
        run: pnpm --filter @workspace/web run build

      - name: Start API server (background)
        if: env.SUPABASE_DB_PASSWORD != ''
        run: |
          PORT=${API_PORT} \
            python -m uvicorn app.main:app \
              --app-dir artifacts/api-server \
              --host 0.0.0.0 --port ${API_PORT} \
              > /tmp/api-server.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for API readiness
        if: env.SUPABASE_DB_PASSWORD != ''
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${API_PORT}/api/healthz" >/dev/null 2>&1; then
              echo "API is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::API server did not become ready in 60s"
          tail -n 200 /tmp/api-server.log || true
          exit 1

      - name: Start web preview (background)
        run: |
          PORT=${WEB_PORT} BASE_PATH=${BASE_PATH} \
            pnpm --filter @workspace/web run serve \
              > /tmp/web-preview.log 2>&1 &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for web preview readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${WEB_PORT}/" >/dev/null 2>&1; then
              echo "Web is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Web preview did not become ready in 60s"
          tail -n 200 /tmp/web-preview.log || true
          exit 1

      - name: Run Playwright suite
        run: pnpm --filter @workspace/web run test:e2e

      - name: Stop background services
        if: always()
        run: |
          [ -n "${WEB_PID:-}" ] && kill "${WEB_PID}" 2>/dev/null || true
          [ -n "${API_PID:-}" ] && kill "${API_PID}" 2>/dev/null || true

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces / screenshots / videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: artifacts/web/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            /tmp/api-server.log
            /tmp/web-preview.log
          if-no-files-found: ignore
          retention-days: 7

      # ----------------------------------------------------------------------
      # On failure, publish the Playwright HTML report to the `gh-pages`
      # branch under `pr-<number>/run-<runid>/` (or `branch-<sanitized>/...`
      # for non-PR runs) and post a sticky PR comment linking to it. This
      # means operators can click straight into the rendered report instead
      # of downloading the raw artifact zip from the GitHub UI.
      #
      # Requires GitHub Pages to be enabled for the repo with source set to
      # the `gh-pages` branch (Settings → Pages). The first failed run will
      # initialize the branch automatically.
      # ----------------------------------------------------------------------
      - name: Publish Playwright HTML report to gh-pages
        if: failure()
        id: publish-report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -d artifacts/web/playwright-report ] || \
             [ -z "$(ls -A artifacts/web/playwright-report 2>/dev/null)" ]; then
            echo "No HTML report on disk; skipping publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${PR_NUMBER}" ]; then
            SUBDIR="pr-${PR_NUMBER}/run-${RUN_ID}"
          else
            SAFE_REF="$(printf '%s' "${REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')"
            SUBDIR="branch-${SAFE_REF}/run-${RUN_ID}"
          fi

          WORK="$(mktemp -d)"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "${REPO_URL}" gh-pages >/dev/null 2>&1; then
            git clone --depth=1 --branch=gh-pages "${REPO_URL}" "${WORK}"
          else
            echo "gh-pages branch does not exist yet; initializing it."
            git clone --depth=1 "${REPO_URL}" "${WORK}"
            (
              cd "${WORK}"
              git checkout --orphan gh-pages
              git rm -rf . >/dev/null 2>&1 || true
              # Placeholder index; the renderer below will overwrite it once
              # the first report is copied in.
              cat > index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Playwright reports</title>
          <h1>Playwright reports</h1>
          <p>Per-run HTML reports live under <code>pr-&lt;number&gt;/run-&lt;id&gt;/</code>
          and <code>branch-&lt;name&gt;/run-&lt;id&gt;/</code>.</p>
          HTML
              git add index.html
              git -c user.name='github-actions[bot]' \
                  -c user.email='github-actions[bot]@users.noreply.github.com' \
                  commit -m "Initialize gh-pages for Playwright reports"
              git push -u origin gh-pages
            )
          fi

          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          REPORT_URL="https://${OWNER}.github.io/${REPO}/${SUBDIR}/"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Build the metadata file once (in the runner workspace, not in
          # the gh-pages clone) so we can re-apply it verbatim if we have
          # to reset the gh-pages clone after a concurrent push.
          META_TMP="$(mktemp)"
          jq -n \
            --arg run_id        "${RUN_ID}" \
            --arg run_attempt   "${GITHUB_RUN_ATTEMPT:-}" \
            --arg published_at  "${PUBLISHED_AT}" \
            --arg ref           "${GITHUB_REF:-}" \
            --arg ref_name      "${REF_NAME}" \
            --arg sha           "${GITHUB_SHA:-}" \
            --arg pr_number     "${PR_NUMBER:-}" \
            --arg run_url       "${RUN_URL}" \
            --arg report_url    "${REPORT_URL}" \
            --arg actor         "${GITHUB_ACTOR:-}" \
            '{run_id: $run_id, run_attempt: $run_attempt,
              published_at: $published_at,
              ref: $ref, ref_name: $ref_name, sha: $sha,
              pr_number: $pr_number,
              run_url: $run_url, report_url: $report_url,
              actor: $actor}' \
            > "${META_TMP}"

          # Build the commit on top of whatever HEAD currently is. Called
          # once before the first push; called again after each
          # reset-to-origin retry so the report + metadata + rendered
          # index are reapplied cleanly on top of any concurrent commits.
          build_publish_commit() {
            mkdir -p "${WORK}/${SUBDIR}"
            cp -R artifacts/web/playwright-report/. "${WORK}/${SUBDIR}/"
            cp "${META_TMP}" "${WORK}/${SUBDIR}/_meta.json"
            python3 "${GITHUB_WORKSPACE}/.github/scripts/render-gh-pages-index.py" "${WORK}"
            (
              cd "${WORK}"
              git add "${SUBDIR}" index.html
              if git diff --cached --quiet; then
                # Nothing changed (e.g. the concurrent push already
                # contained an identical state). Nothing to commit.
                return 0
              fi
              git -c user.name='github-actions[bot]' \
                  -c user.email='github-actions[bot]@users.noreply.github.com' \
                  commit -m "Publish Playwright report: ${SUBDIR}"
            )
          }

          build_publish_commit

          # Push with retry-on-conflict. A concurrent publisher might have
          # pushed between our clone and our push, in which case the
          # rebased tree has a different `index.html`; rather than risk a
          # rebase conflict on generated HTML, hard-reset to the new
          # origin tip and re-render the index against the merged tree.
          attempt=0
          MAX_ATTEMPTS=5
          until (cd "${WORK}" && git push origin gh-pages); do
            attempt=$((attempt + 1))
            if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
              echo "::error::Failed to push gh-pages after ${attempt} attempts."
              exit 1
            fi
            echo "::warning::Push attempt ${attempt} failed; resyncing with origin/gh-pages."
            (
              cd "${WORK}"
              git fetch --depth=1 origin gh-pages
              git reset --hard FETCH_HEAD
            )
            build_publish_commit
            sleep $(( attempt * 2 ))
          done

          echo "Report published to: ${REPORT_URL}"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "report_url=${REPORT_URL}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR with report link
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_URL: ${{ steps.publish-report.outputs.report_url }}
          REPORT_PUBLISHED: ${{ steps.publish-report.outputs.published }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const runId = context.runId;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const reportUrl = process.env.REPORT_URL;
            const published = process.env.REPORT_PUBLISHED === 'true';

            // Walk the Playwright JSON report and collect the titles of
            // tests that did not end in `passed` or `skipped`.
            const failures = [];
            try {
              const raw = fs.readFileSync(
                'artifacts/web/test-results/results.json', 'utf8');
              const data = JSON.parse(raw);
              const walk = (suite, prefix) => {
                const title = suite.title ? [...prefix, suite.title] : prefix;
                for (const child of suite.suites || []) walk(child, title);
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    const ok = (test.results || []).every(
                      r => r.status === 'passed' || r.status === 'skipped');
                    if (!ok) failures.push([...title, spec.title].join(' > '));
                  }
                }
              };
              for (const s of data.suites || []) walk(s, []);
            } catch (err) {
              core.warning(`Could not parse Playwright JSON report: ${err.message}`);
            }

            const marker = '<!-- playwright-report-comment -->';
            const lines = [marker, '### Playwright e2e failed', ''];
            if (published && reportUrl) {
              lines.push(`**HTML report:** ${reportUrl}`);
            } else {
              lines.push('**HTML report:** not available (download the `playwright-report` artifact from the run instead).');
            }
            lines.push(`**Workflow run:** ${runUrl}`);
            lines.push('');
            if (failures.length) {
              lines.push(`**Failing tests (${failures.length}):**`);
              const shown = failures.slice(0, 25);
              for (const name of shown) lines.push(`- \`${name}\``);
              if (failures.length > shown.length) {
                lines.push(`- _…and ${failures.length - shown.length} more — see the report._`);
              }
            } else {
              lines.push('_No individual test failures parsed; the job itself failed (build, server start, etc.). Check the run logs._');
            }
            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(
              c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body });
            }

  mobile-playwright:
    name: Playwright (mobile operator journey)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      # Expo dev server (Metro web export) — Playwright drives this
      # port directly. Kept distinct from the web job's WEB_PORT so
      # the two jobs could in theory run on the same runner.
      MOBILE_PORT: "5000"
      # API server (FastAPI) — must match what the mobile app talks to.
      API_PORT: "8080"
      # Where the mobile Playwright config points its browser.
      E2E_MOBILE_BASE_URL: "http://localhost:5000"

      # Clerk dev-instance credentials. Same passwordless dev keys as
      # the web job — Clerk's testing helper mints the sign-in ticket,
      # no real password required. EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY
      # is what `@clerk/expo` reads inside the bundle.
      CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}

      # Same operator account the web job uses so the auth-gated
      # mobile dashboard test doesn't self-skip.
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}

      # Tells the mobile bundle where the API lives. `lib/api.ts`
      # consumes EXPO_PUBLIC_DOMAIN as a bare host and prepends the
      # scheme. Auth-gated tests skip themselves if the dashboard
      # never renders (e.g. unapproved user), so the public smoke
      # test still runs even when these aren't reachable.
      EXPO_PUBLIC_DOMAIN: "localhost:8080"

      # Backend secrets the API server needs to come up + serve auth-
      # gated dashboard data. Auth-gated tests skip themselves if the
      # dashboard never renders, so the public smoke test still works
      # without them.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPERATOR_ALLOWED_EMAILS: ${{ secrets.OPERATOR_ALLOWED_EMAILS }}
      OPERATOR_ADMIN_EMAILS: ${{ secrets.OPERATOR_ADMIN_EMAILS }}
      AXIOM_CORS_ORIGINS: "*"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps (FastAPI + asyncpg + …)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (+ system libs)
        run: pnpm --filter @workspace/mobile exec playwright install --with-deps chromium

      - name: Start API server (background)
        if: env.SUPABASE_DB_PASSWORD != ''
        run: |
          PORT=${API_PORT} \
            python -m uvicorn app.main:app \
              --app-dir artifacts/api-server \
              --host 0.0.0.0 --port ${API_PORT} \
              > /tmp/api-server.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for API readiness
        if: env.SUPABASE_DB_PASSWORD != ''
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${API_PORT}/api/healthz" >/dev/null 2>&1; then
              echo "API is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::API server did not become ready in 60s"
          tail -n 200 /tmp/api-server.log || true
          exit 1

      - name: Start Expo dev server (background)
        # The mobile artifact's `dev` script depends on Replit-only
        # env vars (REPLIT_DEV_DOMAIN / REPLIT_EXPO_DEV_DOMAIN) that
        # don't exist on a GitHub runner, so we invoke `expo start`
        # directly with just the bits it needs for the web export.
        run: |
          pnpm --filter @workspace/mobile exec expo start \
              --localhost --port ${MOBILE_PORT} \
              > /tmp/expo.log 2>&1 &
          echo "EXPO_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Expo dev server readiness
        run: |
          # Metro exposes /status as a liveness probe once the
          # dev server is accepting requests; the web bundle is
          # built lazily on first request, so the Playwright tests
          # tolerate the cold-start.
          for i in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${MOBILE_PORT}/status" >/dev/null 2>&1; then
              echo "Expo is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Expo dev server did not become ready in 120s"
          tail -n 200 /tmp/expo.log || true
          exit 1

      - name: Run mobile Playwright suite
        run: pnpm --filter @workspace/mobile run test:e2e

      - name: Stop background services
        if: always()
        run: |
          [ -n "${EXPO_PID:-}" ] && kill "${EXPO_PID}" 2>/dev/null || true
          [ -n "${API_PID:-}" ] && kill "${API_PID}" 2>/dev/null || true

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-report
          path: artifacts/mobile/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces / screenshots / videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-test-results
          path: artifacts/mobile/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-server-logs
          path: |
            /tmp/api-server.log
            /tmp/expo.log
          if-no-files-found: ignore
          retention-days: 7
