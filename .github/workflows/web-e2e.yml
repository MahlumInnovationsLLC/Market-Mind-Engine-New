name: web-e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (operator + admin)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      # Web preview / Vite — `PORT` is read by `vite.config.ts` at config
      # load time (it throws if unset), so we expose it job-wide so both
      # the build step and the preview step pick it up.
      PORT: "5173"
      WEB_PORT: "5173"
      BASE_PATH: "/"
      # API server (FastAPI) — must match what the web app talks to.
      API_PORT: "8080"
      # Where Playwright points its browser.
      E2E_BASE_URL: "http://localhost:5173"

      # Clerk dev-instance credentials. These are passwordless dev keys
      # used only by Clerk's testing helper; they are NOT prod keys.
      CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}

      # Test-user emails (passwordless ticket strategy — Clerk mints
      # the sign-in token, no password required).
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      E2E_CLERK_ADMIN_EMAIL: ${{ secrets.E2E_CLERK_ADMIN_EMAIL }}
      E2E_CLERK_ADMIN_PASSWORD: ${{ secrets.E2E_CLERK_ADMIN_PASSWORD }}

      # Backend secrets the API server needs to come up + serve auth-
      # gated dashboard data. Auth-gated tests skip themselves if these
      # are absent, so the public-surface matrix still runs without them.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPERATOR_ALLOWED_EMAILS: ${{ secrets.OPERATOR_ALLOWED_EMAILS }}
      OPERATOR_ADMIN_EMAILS: ${{ secrets.OPERATOR_ADMIN_EMAILS }}
      AXIOM_CORS_ORIGINS: "*"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps (FastAPI + asyncpg + …)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (+ system libs)
        run: pnpm --filter @workspace/web exec playwright install --with-deps chromium

      - name: Build web bundle
        run: pnpm --filter @workspace/web run build

      - name: Start API server (background)
        if: env.SUPABASE_DB_PASSWORD != ''
        run: |
          PORT=${API_PORT} \
            python -m uvicorn app.main:app \
              --app-dir artifacts/api-server \
              --host 0.0.0.0 --port ${API_PORT} \
              > /tmp/api-server.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for API readiness
        if: env.SUPABASE_DB_PASSWORD != ''
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${API_PORT}/api/healthz" >/dev/null 2>&1; then
              echo "API is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::API server did not become ready in 60s"
          tail -n 200 /tmp/api-server.log || true
          exit 1

      - name: Start web preview (background)
        run: |
          PORT=${WEB_PORT} BASE_PATH=${BASE_PATH} \
            pnpm --filter @workspace/web run serve \
              > /tmp/web-preview.log 2>&1 &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for web preview readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${WEB_PORT}/" >/dev/null 2>&1; then
              echo "Web is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Web preview did not become ready in 60s"
          tail -n 200 /tmp/web-preview.log || true
          exit 1

      - name: Run Playwright suite
        run: pnpm --filter @workspace/web run test:e2e

      - name: Stop background services
        if: always()
        run: |
          [ -n "${WEB_PID:-}" ] && kill "${WEB_PID}" 2>/dev/null || true
          [ -n "${API_PID:-}" ] && kill "${API_PID}" 2>/dev/null || true

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces / screenshots / videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: artifacts/web/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            /tmp/api-server.log
            /tmp/web-preview.log
          if-no-files-found: ignore
          retention-days: 7
