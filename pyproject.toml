[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "anyio==4.7.0",
    "asyncpg==0.30.0",
    "cryptography>=43,<47",
    "pyjwt>=2.10,<3",
    "fastapi==0.115.5",
    "httpx>=0.26,<0.28",
    "joblib>=1.5.3",
    "numpy>=2.4.4",
    "websockets>=13.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "scikit-learn>=1.8.0",
    "structlog==24.4.0",
    "supabase==2.10.0",
    "uvicorn[standard]==0.32.1",
    "pytest>=9.0.3",
    "pytest-xdist>=3.6",
    "openai>=1.50,<2",
    "anthropic>=0.40,<1",
    "stripe>=15.0.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "eth-account>=0.10.0",
    "eccodes>=2.46",
    "eccodeslib>=2.46",
    "lightgbm>=4.6.0",
    "xgboost>=3.2.0",
    "torch>=2.11.0",
    "google-genai>=1.2.0",
]

[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]
